# bpm-rulepacks — performance v1 (W9-08, CODE_HEALTH_SUITE.md §9.1).
#
# PROVENANCE: written for RepoPulse. Nothing here is copied or adapted from the
# Semgrep registry (DESIGN_REVIEW.md G-18).
#
# These are STRUCTURAL patterns, not benchmarks. None of them claims a speedup:
# the checklist that came before this pack (performance.v2, W9-05) explicitly
# forbids quoting the widely-cited try/catch multiplier, and a rule cannot know an
# engine version either. Each message says what the SHAPE costs and leaves the
# measurement to whoever profiles it.
#
# Severity tops out at WARNING (3 in our scale — see output.ts). A performance
# shape is not exploitable, and a rule that outranks a real vulnerability in a
# sorted list is a mis-sorted list. Semgrep takes keywords here, not numbers:
# a numeric severity fails the whole PACK to load, which is the failure W8-07
# built tool-error surfacing for.
rules:
  - id: bpm-perf-orm-call-in-loop
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A database call inside a loop. N rows means N round trips, and the cost
      grows with data nobody controls — this is the shape behind most "it was
      fast in staging" reports.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    # pattern-inside + pattern, not one big block pattern: a JS `for (...) { ...
    # $CALL ... }` does not parse as a semgrep pattern (the body ellipsis needs
    # statements around it), and the whole RULE fails to load rather than the
    # match failing — which is silent unless someone reads the tool errors.
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              while (...) { ... }
      # `for await (...)` is NOT here: semgrep's JS parser rejects it as a
      # pattern, and a rule that fails to parse takes the whole rule down
      # silently. An async iteration over a cursor is also the one loop where a
      # per-item DB call is often correct.
      #
      # AWAITED calls only (W21-20 hand-check). A query returns a promise and is
      # awaited (`await db.get(id)`, `await group.update(...)`); the hasher,
      # lodash, Reflect, ProseMirror, widget and cache methods that share these
      # names are synchronous. Before this, 20 of 30 marked hits on the
      # hand-check corpus were such calls, and earlier 233 of 327 on this
      # repository were Map.get. A query builder's `.delete(table)` sits inside
      # an awaited chain (`await tx.delete(t).where(...)`), so it is matched
      # there.
      - pattern-either:
          - pattern: await $DB.$M(...)
          - patterns:
              - pattern: $DB.$M($KEY)
              - pattern-inside: await $DB.$M($KEY).$NEXT(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^delete$
      # A call inside a BOUNDED batch is the fix, not the defect — same
      # reasoning as await-in-loop above, and again the clean fixture is what
      # caught it.
      - pattern-not-inside: Promise.all(...)
      # `await Promise.all(...)` is the batch itself, not a query (`all` is on
      # the method list for knex/sqlite).
      - metavariable-regex:
          metavariable: $DB
          regex: ^(?!Promise$).*
      - metavariable-regex:
          metavariable: $M
          # The ORM surfaces this codebase and its customers actually use.
          regex: ^(query|execute|findUnique|findFirst|findMany|select|insert|update|delete|raw|get|all|one)$

  - id: bpm-perf-await-in-loop
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      An await inside a loop serialises work that may be independent. If the
      iterations do not depend on each other, the loop is N times its own
      latency for no reason — and if they do, a comment saying so saves the
      next reader the analysis.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              while (...) { ... }
      - pattern: await $X
      # A transaction genuinely has to be awaited in sequence.
      - pattern-not: await $DB.transaction(...)
      # Awaiting a BOUNDED batch inside a loop is the fix this rule asks for —
      # firing on it would make the rule impossible to satisfy. The clean
      # fixture is what caught that.
      - pattern-not: await Promise.all(...)
      - pattern-not: await Promise.allSettled(...)
      # Retry and backoff loops are sequential on purpose: attempt N+1 only
      # happens because attempt N failed. The W18-17 benchmark caught this
      # rule firing on exactly that shape, so a loop is exempt when it hands
      # the result back on success (return/break) AND it either counts
      # attempts against a bound with the work in a try, or sleeps/backs off
      # between attempts. Neither half alone is enough: a counted loop that
      # returns the first match is a search that could run in parallel, and
      # a loop that sleeps but never stops early is pacing a batch.
      - pattern-not-inside:
          pattern-either:
            - patterns:
                - pattern-either:
                    - pattern: for (...; $I < $N; ...) $BODY
                    - pattern: for (...; $I <= $N; ...) $BODY
                    - pattern: for (...; $I > $N; ...) $BODY
                    - pattern: for (...; $I >= $N; ...) $BODY
                    - pattern: while ($I < $N) $BODY
                    - pattern: while ($I <= $N) $BODY
                - metavariable-pattern:
                    metavariable: $BODY
                    pattern-either:
                      - pattern: try { ... return ...; } catch ($E) { ... }
                      - pattern: try { ... break; } catch ($E) { ... }
            - patterns:
                - pattern-either:
                    - pattern: for (...) $BODY
                    - pattern: while ($C) $BODY
                - metavariable-pattern:
                    metavariable: $BODY
                    pattern-either:
                      - patterns:
                          - pattern: await $SLEEP(...)
                          - metavariable-regex:
                              metavariable: $SLEEP
                              regex: (?i)^(.*\.)?(\w*(sleep|delay|backoff)\w*|wait|pause|setTimeout)$
                      - pattern: await new Promise(($R) => setTimeout(...))
                - metavariable-pattern:
                    metavariable: $BODY
                    pattern-either:
                      - pattern: return ...;
                      - pattern: break;

  - id: bpm-perf-sync-io-in-async
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Synchronous filesystem work inside an async function. It blocks the event
      loop, so every other request waits — including the health check that would
      have told you.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    # Build scripts and tooling run once, offline: blocking there blocks no
    # one. 4 of the 12 hits marked wrong in W21-20 were in `build.js` or
    # `tools/`.
    paths:
      exclude:
        - 'build.*'
        - '*.config.*'
        - '**/tools/**'
        - '**/scripts/**'
    patterns:
      - pattern-inside: |
          async function $F(...) { ... }
      # Not existsSync: one stat call, and every one of the 4 marked in
      # W21-20 was a one-off check before a stream or at startup.
      - pattern-either:
          - pattern: readFileSync(...)
          - pattern: writeFileSync(...)
          - pattern: readdirSync(...)
          - pattern: $FS.readFileSync(...)
          - pattern: $FS.writeFileSync(...)

  - id: bpm-perf-json-deep-clone
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      JSON.parse(JSON.stringify(x)) as a deep clone. It allocates the whole
      structure twice, drops undefined, Dates, Maps and Sets, and throws on a
      cycle — structuredClone does the job without the surprises.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    pattern: JSON.parse(JSON.stringify($X))

  - id: bpm-perf-regex-compile-in-loop
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      A regular expression constructed inside a loop. Each iteration compiles it
      again; hoisting it out is a one-line change and the only reason not to is
      that the pattern itself varies per iteration.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              while (...) { ... }
      # Only a pattern that is the SAME every iteration, which is what can be
      # hoisted (W21-20 hand-check): a string literal, or a template whose every
      # `${…}` is a constant reference (`(.*)/${Buckets.uploads}/`, `${MAX_LEN}`).
      # A pattern built from the element (an attachment URL, an alert word, an
      # SVG id, `${escapeRegExp(path)}`) is a different regex each iteration:
      # 17 of 19 hits on the hand-check corpus were that, with nothing to move.
      - pattern-either:
          - pattern: new RegExp("...")
          - pattern: new RegExp("...", $FLAGS)
          - patterns:
              - pattern-either:
                  - pattern: new RegExp($ARG)
                  - pattern: new RegExp($ARG, $FLAGS)
              - metavariable-regex:
                  metavariable: $ARG
                  # A template literal whose interpolations are all
                  # Capitalised.dotted.names: module constants and enums.
                  # The closing `}` and backtick are optional because semgrep
                  # (1.176) binds a template's text without them.
                  regex: '^`([^`$\\]|\\.|\$(?!\{)|\$\{[A-Z][A-Za-z0-9_]*(\.[A-Za-z0-9_]+)*(\}|$))*`?$'

  - id: bpm-perf-string-concat-in-loop
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      Building a string by repeated concatenation in a loop. Modern engines
      optimise the simple case well, so this is a note rather than a problem —
      push to an array and join when the loop is large or hot.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    patterns:
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              while (...) { ... }
      - pattern: $S += $X
      - metavariable-regex:
          metavariable: $S
          regex: (?i).*(str|text|html|sql|query|out|buf|result|body|message|content).*
      # The name list cannot tell a counter from a string (`count` contains
      # `out`, `result.skipped` contains `result`), so a visibly numeric
      # right-hand side rules it out: a number, a `.length` or `.size`, or a
      # `...count` value. All 4 numeric hits marked wrong in W21-20 were one.
      - metavariable-regex:
          metavariable: $X
          regex: ^(?!\d+(\.\d+)?$)(?!.*\.(length|size)( \|\| 0)?$)(?!.*[cC]ount$)
      # `s += s` doubles: the O(log n) way to repeat a string, already the fix.
      - pattern-not: $S += $S

  - id: bpm-perf-unbounded-promise-all
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Promise.all over a mapped collection with no concurrency limit. One
      promise per element means the fan-out is whatever the data happens to be —
      fine for ten rows, an outage for ten thousand.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    patterns:
      - pattern-either:
          - pattern: await Promise.all($ROWS.map(...))
          - pattern: Promise.all($ROWS.map(...))
      # A slice IS the bound. The clean fixture caught this: batching ten at a
      # time is the fix this rule asks for, and firing on it would make the
      # rule impossible to satisfy.
      - pattern-not: await Promise.all($X.slice(...).map(...))
      - pattern-not: Promise.all($X.slice(...).map(...))

  - id: bpm-perf-orm-call-in-loop-py
    languages: [python]
    severity: WARNING
    message: >-
      A database call inside a loop. N rows means N round trips, and the cost
      grows with data nobody controls.
    metadata:
      source: CODE_HEALTH_SUITE 9.1
      category: performance
      provenance: written for RepoPulse; not derived from any registry pack
    # Tightened in W18-11 after a run over seventeen real Python codebases
    # (Django, SQLAlchemy, Flask, …): the first version matched `.get`,
    # `.filter` and `.all` on ANY receiver — every dict lookup in a loop — and
    # reported the whole loop rather than the call. Each surface below is one
    # whose receiver says "database".
    patterns:
      - &py-db-call
        pattern-either:
          # DB-API cursors and SQLAlchemy connections.
          - patterns:
              - pattern: $DB.$M(...)
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(execute|executemany|exec_driver_sql)$
          # Django managers: `Model.objects.<anything>` is a query.
          - pattern: $MODEL.objects.$Q(...)
          # SQLAlchemy sessions, by the names sessions are actually given.
          - patterns:
              - pattern: $SESSION.$M(...)
              - metavariable-regex:
                  metavariable: $SESSION
                  regex: (?i)^(.*\.)?_?(session|db_session|dbsession|db)$
              - metavariable-regex:
                  metavariable: $M
                  regex: ^(query|get|scalar|scalars|execute|refresh|merge|flush)$
          # Django model saves: no positional arguments, which is what tells
          # `instance.save()` apart from `image.save(path)`.
          - pattern: $OBJ.save()
          - pattern: $OBJ.save($KW=$V, ...)
      # The loop BODY, not the loop: `for row in session.scalars(q):` calls
      # once, and so does a comprehension's iterable. pattern-inside alone
      # covers the header too, so each form focuses on its body.
      - pattern-either:
          - patterns:
              - pattern-inside: |
                  for $ROW in $ROWS:
                      $...BODY
              - focus-metavariable: $...BODY
          - patterns:
              - pattern-inside: |
                  while $COND:
                      $...BODY
              - focus-metavariable: $...BODY
          # A comprehension is a loop too, and the commonest place for this.
          # The call must be inside the element: without the check a call
          # that WRAPS a comprehension, `bulk_create([E(x) for x in xs])` or
          # `filter(id__in=[x.id for x in xs])`, matched on the element. That
          # is one query, and it was 6 of the 13 hits marked wrong (W21-20).
          - patterns:
              - pattern-inside: '[$E for $V in $XS]'
              - focus-metavariable: $E
              - metavariable-pattern:
                  metavariable: $E
                  patterns: [*py-db-call]
          - patterns:
              - pattern-inside: '{$E for $V in $XS}'
              - focus-metavariable: $E
              - metavariable-pattern:
                  metavariable: $E
                  patterns: [*py-db-call]
          - patterns:
              - pattern-inside: '($E for $V in $XS)'
              - focus-metavariable: $E
              - metavariable-pattern:
                  metavariable: $E
                  patterns: [*py-db-call]
      # Batched by design: `bulk_create` / `bulk_update` in a loop is the
      # chunked form, one query per batch rather than per row (W21-20).
      - pattern-not: $MODEL.objects.bulk_create(...)
      - pattern-not: $MODEL.objects.bulk_update(...)
      # A queryset assigned and not evaluated runs no query: `qs =
      # Doc.objects.filter(...)` or `.none()` (W21-20). Chained to an
      # evaluating call, `.filter(...).first()`, the right-hand side is the
      # whole chain and this does not apply. `x = Doc.objects.get(...)` runs
      # its query, so only the lazy methods are named.
      - pattern-not-inside: $X = $MODEL.objects.filter(...)
      - pattern-not-inside: $X = $MODEL.objects.exclude(...)
      - pattern-not-inside: $X = $MODEL.objects.none(...)
      - pattern-not-inside: $X = $MODEL.objects.all(...)
      - pattern-not-inside: $X = $MODEL.objects.using(...)
