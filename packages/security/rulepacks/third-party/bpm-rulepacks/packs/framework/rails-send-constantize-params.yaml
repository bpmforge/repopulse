rules:
  - id: bpm-framework-rails-send-constantize-params
    languages: [ruby]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: params[$X]
      - pattern: params.$X
    pattern-sinks:
      - pattern: $OBJ.send($SINK)
      - pattern: $OBJ.public_send($SINK)
      - pattern: $SINK.constantize
      - pattern: $SINK.safe_constantize
    pattern-sanitizers:
      - pattern: $ALLOWLIST.fetch($SINK)
    message: >
      Request params reach send()/public_send() or constantize with no
      allow-list in between (Rails framework knowledge, CWE-470: Unsafe
      Reflection). send()/public_send() invoke an attacker-chosen method
      name on the receiver — including private setters, destroy, or
      arbitrary business methods; constantize resolves an attacker-chosen
      string to any loaded Ruby class, which can be chained into further
      unsafe reflection or object instantiation. Both are exactly the "type
      confusion via reflection" pattern that has produced real Rails RCEs.
      Validate the params value against an explicit allow-list of method
      or class names before passing it to send/constantize.
    # Primary source: Rails Security Guide (Unsafe Query Generation /
    # dynamic dispatch guidance) + OWASP Unsafe Reflection guidance.
    metadata:
      license: MIT
      provenance: authored
      cwe: [470]
      owasp: "A03:2021"
      framework: rails
      confidence: medium
      concept: input_validation
      since: "0.1.0"
