rules:
  - id: bpm-framework-echo-sql-injection
    languages: [go]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $C.QueryParam($X)
      - pattern: $C.Param($X)
      - pattern: $C.FormValue($X)
    pattern-propagators:
      - pattern: fmt.Sprintf($FMT, ...)
        from: $FMT
        to: $FMT
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($SINK)
              - pattern: $DB.QueryContext($CTX, $SINK)
              - pattern: $DB.QueryRow($SINK)
              - pattern: $DB.QueryRowContext($CTX, $SINK)
              - pattern: $DB.Exec($SINK)
              - pattern: $DB.ExecContext($CTX, $SINK)
          # Same disambiguation as gin-sql-injection — echo.Context also
          # exposes QueryParam/Param/FormValue, none of which collide with
          # "Query"/"Exec" by name, but the constraint is kept for
          # defense-in-depth and consistency with the Gin rule.
          - metavariable-regex:
              metavariable: $DB
              regex: '.*(db|Db|DB|conn|Conn|tx|Tx|database|Database).*'
    message: >
      Unsanitized Echo request input (c.QueryParam/c.Param/c.FormValue)
      reaches a database/sql Query/Exec call as the SQL text, either via
      fmt.Sprintf interpolation or direct string concatenation (Echo
      framework knowledge, OWASP A03:2021, CWE-89: SQL Injection). An
      attacker who controls this value can alter the query's structure to
      read, modify, or delete data outside the intended scope. Use a
      parameterized query (`?`/`$1` placeholders passed as separate
      Query/Exec arguments) instead of building the SQL string from
      request data.
    # Primary source: Echo framework docs (Context: QueryParam/Param/
    # FormValue) + database/sql docs (Query/Exec parameterization) +
    # OWASP A03:2021.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      framework: echo
      confidence: high
      concept: sql_database
      since: "0.1.0"
