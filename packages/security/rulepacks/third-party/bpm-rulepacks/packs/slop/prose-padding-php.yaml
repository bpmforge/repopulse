rules:
  - id: bpm-slop-prose-padding-php
    languages: [php]
    severity: WARNING
    message: >
      Padding phrase inside a PHP comment (ANTI_SLOP R-29: Prose Padding) —
      hedging ("it's worth noting that") or fake-specificity ("industry
      best practices") language inflates a comment or docblock without
      adding information. State the behavior directly, or name the actual
      standard/source if citing one.
    pattern-regex: (?im)^\s*(//|#|\*|/\*).*\b(it'?s worth noting that|it should be mentioned that|one might consider|it is important to note that|industry best practices|modern approaches|established patterns)\b
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-29"
      cwe: [1078]
      confidence: medium
      concept: code_quality
      since: "0.1.0"

  - id: bpm-slop-prose-padding-param-php
    languages: [php]
    severity: WARNING
    message: >
      PHPDoc @param restates the parameter name instead of documenting the
      WHY (ANTI_SLOP R-24/R-29: Docstring Inflation / Prose Padding).
      "@param int $id the id" duplicates what the signature already says
      and adds word count with zero information. Document a non-obvious
      constraint, or delete the tag.
    pattern-regex: (?i)@param\s+\S+\s+\$?(\w+)\s+the\s+\1\b
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-24/R-29"
      cwe: [1078]
      confidence: medium
      concept: code_quality
      since: "0.1.0"
