rules:
  - id: bpm-slop-delegation-only-wrapper-python
    languages: [python]
    severity: INFO
    message: >
      delegation-only wrapper function (ANTI_SLOP R-06) adds a name and
      call frame for zero behavior — it forwards every argument unchanged to
      another callable with no transformation, validation, caching, or error
      mapping. Call the wrapped function directly at the call site, or add
      real logic to justify the wrapper.
    patterns:
      - pattern-either:
          - pattern: |
              def $FUNC():
                  return $OTHER()
          - pattern: |
              def $FUNC($A):
                  return $OTHER($A)
          - pattern: |
              def $FUNC($A, $B):
                  return $OTHER($A, $B)
          - pattern: |
              def $FUNC($A, $B, $C):
                  return $OTHER($A, $B, $C)
      - metavariable-regex:
          # $OTHER must be a plain identifier or dotted identifier chain
          # (a function/method/service call by name) — excludes calls whose
          # receiver is a literal (e.g. "\n".join(x), [1,2].index(x)),
          # which are ordinary one-line logic, not delegation to another
          # named callable.
          metavariable: $OTHER
          regex: ^[A-Za-z_][A-Za-z0-9_.]*$
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-06"
      cwe: [710]
      confidence: medium
      concept: code_quality
      since: "0.1.0"
