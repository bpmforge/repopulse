rules:
  - id: bpm-slop-unimplemented-stub-throw-cpp
    languages: [cpp]
    severity: WARNING
    message: >
      Function body throws std::logic_error with a "not implemented"
      message (ANTI_SLOP R-27: Unimplemented Stubs as Features). Callers —
      including other AI-generated code that sees this function in
      context — get a runtime exception or treat the stub as a real
      implementation. Stubs are only acceptable on an explicit TODO branch
      called out in the PR description; never export or ship a stub as a
      completed feature.
    patterns:
      - pattern: throw std::logic_error($MSG)
      - metavariable-regex:
          metavariable: $MSG
          regex: (?i)"(.*(not.?implemented|unimplemented|todo.*implement).*)"
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-27"
      cwe: [1078]
      confidence: high
      concept: code_quality
      since: "0.1.0"
