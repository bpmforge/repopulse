rules:
  - id: bpm-slop-unimplemented-stub-throw-csharp
    languages: [csharp]
    severity: WARNING
    message: >
      NotImplementedException thrown from a method with no real
      implementation (ANTI_SLOP R-27: Unimplemented Stubs as Features).
      Callers — including other AI-generated code that sees this method in
      context — get a runtime error or treat the stub as a real
      implementation. Stubs are only acceptable on an explicit TODO branch
      called out in the PR description; never export or ship a stub as a
      completed feature.
    pattern: new NotImplementedException(...)
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-27"
      cwe: [1078]
      confidence: high
      concept: code_quality
      since: "0.1.0"
