rules:
  - id: bpm-slop-try-catch-in-loop-python
    languages: [python]
    severity: WARNING
    message: >
      A catch-all except inside a loop that neither logs nor re-raises
      (ANTI_SLOP R-02): any bad item, and any bug in the loop body, is
      swallowed and the loop carries on as if it had worked. Catch the
      specific error you expect, or log it with the item, or let it raise.
    # Narrowed 2026-10-28 after grading the walkthrough repos (RepoPulse
    # docs/benchmarks/rule-grade-w22-07): 30 of 30 sampled saleor hits were
    # a NARROW except (ValidationError, DoesNotExist, IndexError) handled per
    # item, which is correct code. CPython's try is zero-cost, so the old
    # "prevents the interpreter from optimizing" premise did not hold either.
    # What remains is the shape that hides failures: bare / Exception /
    # BaseException, with no raise and no logger call in the handler.
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except:
                  ...
          - pattern: |
              try:
                  ...
              except Exception:
                  ...
          - pattern: |
              try:
                  ...
              except Exception as $NAME:
                  ...
          - pattern: |
              try:
                  ...
              except BaseException:
                  ...
          - pattern: |
              try:
                  ...
              except BaseException as $NAME:
                  ...
      # A handler that re-raises or logs at warning or above is not hiding anything.
      - pattern-not: |
          try:
              ...
          except:
              ...
              raise ...
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              raise
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              $L.exception(...)
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              $L.error(...)
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              $L.warning(...)
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              $L.warn(...)
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              $L.critical(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              raise ...
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              raise
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              $L.exception(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              $L.error(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              $L.warning(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              $L.warn(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              $L.critical(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              raise ...
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              raise
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $L.exception(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $L.error(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $L.warning(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $L.warn(...)
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $L.critical(...)
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
              raise $EXC from $CAUSE
              ...
      - pattern-not: |
          try:
              ...
          except $T:
              ...
              raise $EXC from $CAUSE
              ...
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              raise $EXC from $CAUSE
              ...
      # A handler that hands the error on (report_error(ctx, e), errors.append(e)) is not swallowing it.
      - pattern-not: |
          try:
              ...
          except $T as $N:
              ...
              $FN(..., $N, ...)
              ...
      - pattern-either:
          - pattern-inside: |
              for $X in $Y:
                  ...
          - pattern-inside: |
              while $COND:
                  ...
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-02"
      cwe: [1050]
      confidence: medium
      concept: logging_audit
      since: "0.1.0"
