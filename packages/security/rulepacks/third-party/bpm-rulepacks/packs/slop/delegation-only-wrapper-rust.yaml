rules:
  - id: bpm-slop-delegation-only-wrapper-rust
    languages: [rust]
    severity: INFO
    message: >
      delegation-only wrapper method (ANTI_SLOP R-06) adds a name and call
      frame for zero behavior — it forwards every argument unchanged to a
      field's method of the same name, with no transformation, validation,
      caching, or error mapping. Call `self.inner.$METHOD(...)` directly at
      the call site, or add real logic to justify the wrapper.
    patterns:
      - pattern-either:
          # &self / &mut self, 0-2 typed params, matching return type — the
          # method name ($METHOD) must be identical on both the outer fn and
          # the inner call, which is what excludes a legitimately-different
          # forwarding call (e.g. `fetch_cached` calling `self.inner.fetch_all()`
          # — different names, so $METHOD can't unify across both occurrences).
          - pattern: |
              fn $METHOD(&self) -> $RET {
                self.$DEP.$METHOD()
              }
          - pattern: |
              fn $METHOD(&self, $A: $TYPEA) -> $RET {
                self.$DEP.$METHOD($A)
              }
          - pattern: |
              fn $METHOD(&self, $A: $TYPEA, $B: $TYPEB) -> $RET {
                self.$DEP.$METHOD($A, $B)
              }
          - pattern: |
              fn $METHOD(&mut self) -> $RET {
                self.$DEP.$METHOD()
              }
          - pattern: |
              fn $METHOD(&mut self, $A: $TYPEA) -> $RET {
                self.$DEP.$METHOD($A)
              }
          - pattern: |
              fn $METHOD(&mut self, $A: $TYPEA, $B: $TYPEB) -> $RET {
                self.$DEP.$METHOD($A, $B)
              }
      # Narrowed 2026-10-28 after grading axum (RepoPulse
      # docs/benchmarks/rule-grade-w22-07): 30 of 30 sampled hits were wrong.
      # A pub accessor on a wrapper over a private field IS the encapsulation,
      # so pub methods are excluded. The finding range starts at `fn`, after
      # the visibility, so this is a lookbehind regex: opengrep's Rust matcher
      # ignores visibility in a `pattern-not: pub fn ...`.
      # NOT fixed: trait impls on a newtype, which must forward, still fire.
      # Every `pattern-not-inside: impl $TRAIT for $TYPE` form tried also
      # matched inherent impls and silenced the vuln fixture.
      - pattern-not-regex: (?<=pub )fn\s
      - pattern-not-regex: (?<=pub\(crate\) )fn\s
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-06"
      cwe: [710]
      confidence: medium
      concept: code_quality
      since: "0.1.0"
