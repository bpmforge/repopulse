rules:
  - id: bpm-slop-hardcoded-env-fallback-php
    languages: [php]
    severity: WARNING
    message: >
      A secret-shaped environment variable falls back to a hardcoded string
      literal via the Elvis operator (ANTI_SLOP R-23, CWE-798: Use of
      Hard-coded Credentials). AI assistants expose secrets at roughly 2x
      the rate of human-only commits (CSA 2025) — this pattern is a common
      source: a "just make it run" default that ships a real or
      production-shaped credential when the env var is unset. Remove the
      literal fallback; fail closed (throw/exit) when a required secret is
      missing.
    patterns:
      - pattern: "getenv($ENV) ?: $FALLBACK"
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i)'[^']*(secret|password|token|api[_-]?key|credential)[^']*'
      - metavariable-pattern:
          metavariable: $FALLBACK
          patterns:
            - pattern: "'...'"
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-23"
      cwe: [798]
      owasp: "A07:2021"
      confidence: high
      concept: secrets_config
      since: "0.1.0"

  - id: bpm-slop-hardcoded-env-fallback-superglobal-php
    languages: [php]
    severity: WARNING
    message: >
      A secret-shaped $_ENV entry falls back to a hardcoded string literal
      via the null-coalescing operator (ANTI_SLOP R-23, CWE-798: Use of
      Hard-coded Credentials). Same failure mode as the getenv() Elvis-
      operator variant — a "just make it run" default ships a real or
      production-shaped credential when the env var is unset. Remove the
      literal fallback; fail closed (throw/exit) when a required secret is
      missing.
    patterns:
      - pattern: "$_ENV[$ENV] ?? $FALLBACK"
      - metavariable-regex:
          metavariable: $ENV
          regex: (?i)'[^']*(secret|password|token|api[_-]?key|credential)[^']*'
      - metavariable-pattern:
          metavariable: $FALLBACK
          patterns:
            - pattern: "'...'"
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-23"
      cwe: [798]
      owasp: "A07:2021"
      confidence: high
      concept: secrets_config
      since: "0.1.0"
