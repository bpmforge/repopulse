rules:
  - id: bpm-slop-try-catch-in-loop
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      try/catch inside a tight loop (ANTI_SLOP R-02) — JIT compilers cannot
      optimize functions with try/catch in hot loops (5-20x slowdown measured
      in production). Wrap the loop, not each iteration; validate before the
      loop if items can be invalid.
    patterns:
      - pattern: |
          try { ... } catch ($ERR) { ... }
      - pattern-either:
          - pattern-inside: |
              for (...) { ... }
          - pattern-inside: |
              for (const $X of $Y) { ... }
          - pattern-inside: |
              for (let $X of $Y) { ... }
          - pattern-inside: |
              for (const $X in $Y) { ... }
          - pattern-inside: |
              for (let $X in $Y) { ... }
          - pattern-inside: |
              while ($COND) { ... }
          - pattern-inside: |
              do { ... } while ($COND)
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-02"
      cwe: [1050]
      confidence: medium
      concept: logging_audit
      since: "0.1.0"

  - id: bpm-slop-try-catch-in-loop-swift
    languages: [swift]
    severity: WARNING
    message: >
      do/catch inside a tight loop (ANTI_SLOP R-02) — JIT-less Swift still pays
      per-iteration setup cost for each do/catch, and the shape usually means
      one bad element aborts handling for the rest of the batch silently.
      Wrap the loop in a single do/catch, not each iteration; validate before
      the loop if items can be invalid.
    patterns:
      - pattern: |
          do { ... } catch { ... }
      - pattern-either:
          - pattern-inside: |
              for $X in $Y { ... }
          - pattern-inside: |
              while $COND { ... }
          - pattern-inside: |
              repeat { ... } while $COND
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-02"
      cwe: [1050]
      confidence: medium
      concept: logging_audit
      since: "0.1.0"

