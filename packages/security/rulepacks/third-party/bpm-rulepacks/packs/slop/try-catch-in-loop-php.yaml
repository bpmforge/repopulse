rules:
  - id: bpm-slop-try-catch-in-loop-php
    languages: [php]
    severity: WARNING
    message: >
      try/catch inside a loop (ANTI_SLOP R-02) — a try/catch per iteration
      is a common sign the exception is being used to skip items rather
      than validate before the loop, and it means one bad item silently
      derails the whole loop's error handling. Wrap the loop, not each
      iteration; validate before the loop if items can be invalid.
    patterns:
      - pattern: |
          try { ... } catch ($EXC $ERR) { ... }
      - pattern-either:
          - pattern-inside: |
              foreach ($ARR as $X) { ... }
          - pattern-inside: |
              foreach ($ARR as $K => $X) { ... }
          - pattern-inside: "for ($INIT; $COND; $STEP) { ... }"
          - pattern-inside: |
              while (...) { ... }
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-02"
      cwe: [1050]
      confidence: medium
      concept: logging_audit
      since: "0.1.0"
