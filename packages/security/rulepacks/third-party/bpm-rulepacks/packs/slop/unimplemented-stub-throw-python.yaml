rules:
  - id: bpm-slop-unimplemented-stub-throw-python
    languages: [python]
    severity: WARNING
    message: >
      Function body raises NotImplementedError (ANTI_SLOP R-27: Unimplemented
      Stubs as Features) outside an @abstractmethod-decorated method. Callers
      — including other AI-generated code that sees this function in
      context — get a runtime error or treat the stub as a real
      implementation. Stubs are only acceptable on an explicit TODO branch
      called out in the PR description; never export or ship a stub as a
      completed feature. (Deliberate abstract-base-class stubs decorated
      with @abstractmethod are excluded — that is the idiomatic Python way
      to declare an interface method with no implementation.)
    patterns:
      - pattern-either:
          - pattern: |
              def $FUNC(...):
                  raise NotImplementedError
          - pattern: |
              def $FUNC(...):
                  raise NotImplementedError(...)
      - pattern-not: |
          @abstractmethod
          def $FUNC(...):
              ...
      - pattern-not: |
          @abc.abstractmethod
          def $FUNC(...):
              ...
      # A method on a class is the base-class contract (2026-10-28, RepoPulse
      # docs/benchmarks/rule-grade-w22-07): 15 of 16 saleor hits were methods
      # of a base class whose subclasses implement them, often a Django model
      # or queryset where ABCMeta is not an option. A module-level function
      # that only raises is still a stub shipped as a feature (saleor's
      # email_resent_event, the one true hit, still fires).
      - pattern-not-inside: |
          class $CLASS:
              ...
      - pattern-not-inside: |
          class $CLASS(...):
              ...
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-27"
      cwe: [1078]
      confidence: medium
      concept: code_quality
      since: "0.1.0"
