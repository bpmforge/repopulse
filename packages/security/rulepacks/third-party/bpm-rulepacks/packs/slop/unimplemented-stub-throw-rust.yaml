rules:
  - id: bpm-slop-unimplemented-stub-throw-rust
    languages: [rust]
    severity: WARNING
    message: >
      Function body is (or contains) a bare `todo!()`/`unimplemented!()`
      macro invocation (ANTI_SLOP R-27: Unimplemented Stubs as Features).
      These are Rust's own explicit, always-panics stub markers — a clean
      signal with no false-positive risk from context (unlike a generic
      "empty function" heuristic). Callers — including other AI-generated
      code that sees this function in context — get a runtime panic or
      treat the stub as a real implementation. Stubs are only acceptable on
      an explicit TODO branch called out in the PR description; never
      export or ship a stub as a completed feature.
    pattern-either:
      - pattern: todo!()
      - pattern: todo!($MSG)
      - pattern: unimplemented!()
      - pattern: unimplemented!($MSG)
    metadata:
      license: public-teaser
      provenance: "ported:bpm-opencode-experts/ANTI_SLOP_RULES R-27"
      cwe: [1078]
      confidence: high
      concept: code_quality
      since: "0.1.0"
