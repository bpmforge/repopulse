rules:
  - id: bpm-secret-pem-private-key
    languages: [generic]
    severity: ERROR
    message: >
      PEM private key block committed to source. Move to a secrets manager
      or environment variable; rotate the exposed key immediately.
    pattern-regex: '-----BEGIN [A-Z ]*PRIVATE KEY-----'
    metadata:
      license: public-teaser
      provenance: ported:slop-scorecard/checks/secrets.ts
      cwe: [321]
      owasp: "A07:2021"
      confidence: high
      concept: secrets_config
      since: "0.1.0"
