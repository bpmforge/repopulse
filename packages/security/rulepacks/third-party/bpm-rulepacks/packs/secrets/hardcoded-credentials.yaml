rules:
  - id: bpm-secret-aws-access-key
    languages: [generic]
    severity: ERROR
    message: >
      Hardcoded AWS access key ID. Move to a secrets manager or environment
      variable; rotate the exposed key immediately.
    pattern-regex: \bAKIA[0-9A-Z]{16}\b
    metadata:
      license: MIT
      provenance: ported:slop-scorecard/checks/secrets.ts
      cwe: [798]
      owasp: "A07:2021"
      confidence: high
      concept: secrets_config
      since: "0.1.0"

  - id: bpm-secret-generic-assignment
    languages: [generic]
    severity: WARNING
    message: >
      Possible hardcoded secret assigned in source. Confirm this is not a live
      credential; if it is, rotate and move to a secret store.
    patterns:
      # `[a-z0-9_]*` before the keyword and `\b` after it let the keyword be the
      # FINAL component of a camelCase/snake_case identifier — jwtSecret,
      # clientSecret, PGPASSWORD, STRIPE_API_KEY — while still rejecting it as a
      # mid-word substring (tokenizer, userSecretary). \b cannot see a camelCase
      # boundary: in `jwtSecret` the S is preceded by `t`, a word character, so
      # the old `\b(secret|...)` never even attempted a match at that offset.
      - pattern-regex: (?i)\b[a-z0-9_]*(api[_-]?key|secret|password|token)\b\s*[:=]\s*["'][^"'\s]{12,}["']
      # --- the three exclusions below are not speculative. An adversarial FP
      # sweep of the widening above, across six real repos, produced 44 new
      # findings of which ZERO were genuine credentials (shipwright 25->46,
      # repopulse 4->25). Each exclusion kills a measured class, not a feared one.
      #
      # 1. A variable dereference is not a literal. `PGPASSWORD="$PGPASSWORD_VAL"`
      #    is correct secret HANDLING, and it was matching inside repopulse's own
      #    egress-audit script. VAR="$OTHER_VAR" is ubiquitous in shell.
      - pattern-not-regex: (?i)[:=]\s*["']\s*\$
      # 2. Placeholders and obviously-fake values. Documentation telling a user to
      #    export their own key ("your-anthropic-key") is the opposite of a leak.
      - pattern-not-regex: (?i)[:=]\s*["'][^"']*(your[-_]|changeme|placeholder|redacted|example|dummy|xxxx|<[a-z_]+>|\.\.\.)
      # 3. Test doubles. 39 of the 44 false positives were fixture literals
      #    (reviewerToken: 'reviewer-token', sessionSecret: 'test-session-secret-…').
      #    Deliberately excluded by VALUE shape as well as by path below, because a
      #    fixture credential in a non-test file is still almost never a real one.
      #    NOTE `sample` is deliberately NOT in this list. It was, for one
      #    iteration, and it silently killed the very defect this change exists
      #    to catch — sampleco's `jwtSecret: "sampleco-super-secret-key"`
      #    contains the substring "sample" as part of a company name. Corpus
      #    coverage fell straight back from 5/16 to 4/16 and said so.
      - pattern-not-regex: (?i)[:=]\s*["'][^"']*(fixture|mock[-_]|fake[-_]|dummy|^test[-_]|[-_]test[-_]|planted|should[-_]not)
      # 4. Identifiers and URLs (added 2026-10-28, RepoPulse
      #    docs/benchmarks/rule-grade-w22-07): 17 of 18 walkthrough hits were a
      #    value made only of letters and underscores (a JSON key mapping, an
      #    enum label, an error code) or an http(s) URL (an OAuth endpoint). A
      #    credential has digits, dashes or symbols: sampleco's
      #    "sampleco-super-secret-key" still fires.
      - pattern-not-regex: (?i)[:=]\s*["'][a-z_]+["']
      - pattern-not-regex: (?i)[:=]\s*["']https?://
    paths:
      # Path-level exclusion for the same reason. Standard practice for secret
      # scanners; without it a repo's own test suite dominates every report.
      # NOTE this trades away real leaks committed into test files — an accepted
      # cost here, because the measured alternative is a 0-out-of-44 signal rate
      # that gets the whole rule ignored.
      #
      # `*fixture*` is deliberately ABSENT: it excluded THIS repo's own
      # fixtures/ directory, so the rule's own RED/GREEN pair could never fire
      # and `npm test` went red immediately. A path filter written for other
      # people's repos has to survive contact with ours.
      exclude:
        - '*test*'
        - '*spec*'
        - '*__tests__*'
        - '*.md'
    metadata:
      license: MIT
      provenance: ported:slop-scorecard/checks/secrets.ts
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
      # KNOWN RECALL GAPS, measured by the same adversarial sweep and filed as
      # queue items rather than silently tolerated. This rule matches only a
      # QUOTED value joined by a SINGLE-character separator, so it misses:
      #   - .env / Dockerfile ENV|ARG  — unquoted values. Arguably the single
      #     most common real-world secret-leak site, and currently 0 detections.
      #   - JSON  — the quoted key ("clientSecret":) puts a `"` between the
      #     identifier's word boundary and the colon, so \b...\b\s*[:=] fails.
      #   - Go `:=` and R `<-`  — [:=] is a single-character class.
      # None of these are regressions; all predate the camelCase fix.
