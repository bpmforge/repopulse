rules:
  - id: bpm-secret-github-pat
    languages: [generic]
    severity: ERROR
    message: >
      Hardcoded GitHub personal access token. Move to a secrets manager or
      environment variable; rotate the exposed token immediately.
    pattern-regex: \bghp_[A-Za-z0-9]{36}\b
    metadata:
      license: public-teaser
      provenance: ported:slop-scorecard/checks/secrets.ts
      cwe: [798]
      owasp: "A07:2021"
      confidence: high
      concept: secrets_config
      since: "0.1.0"
