rules:
  - id: bpm-owasp-a03-command-injection-python
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: request.args.$X
      - pattern: request.args.get(...)
      - pattern: request.form.$X
      - pattern: request.form.get(...)
      - pattern: request.values.$X
      - pattern: request.values.get(...)
      - pattern: request.GET.$X
      - pattern: request.GET.get(...)
      - pattern: request.POST.$X
      - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
    pattern-sinks:
      - pattern: os.system($SINK)
      - pattern: os.popen($SINK)
      - pattern: subprocess.call($SINK, ..., shell=True, ...)
      - pattern: subprocess.run($SINK, ..., shell=True, ...)
      - pattern: subprocess.Popen($SINK, ..., shell=True, ...)
      - pattern: subprocess.check_call($SINK, ..., shell=True, ...)
      - pattern: subprocess.check_output($SINK, ..., shell=True, ...)
    message: >
      Unsanitized Flask (request.args/form/values) or Django (request.GET/POST)
      input reaches os.system(), os.popen(), or a subprocess.call/run/Popen/
      check_call/check_output() invoked with shell=True, typically via
      f-string interpolation or string concatenation into the command line
      (OWASP A03:2021, CWE-78: OS Command Injection). An attacker can inject
      shell metacharacters to run arbitrary commands with the application's
      privileges. Avoid shell=True; pass the command as an argument list
      (subprocess.run(["cmd", arg]) with shell=False, the default) so the
      shell never re-parses the string, or if a shell string is unavoidable,
      wrap every user-controlled token in shlex.quote().
    metadata:
      license: proprietary
      provenance: authored
      cwe: [78]
      owasp: "A03:2021"
      confidence: high
      concept: command_execution
      since: "0.1.0"
