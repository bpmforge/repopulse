rules:
  - id: bpm-owasp-a03-path-traversal-kotlin
    languages: [kotlin]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $INTENT.getStringExtra($X)
      - pattern: $REQ.getParameter($X)
      - pattern: $REQ.getHeader($X)
    pattern-sinks:
      - pattern: File($SINK)
      - pattern: FileInputStream($SINK)
      - pattern: FileOutputStream($SINK)
      - pattern: FileReader($SINK)
      - pattern: FileWriter($SINK)
    message: >
      Unsanitized Intent extra or servlet request input reaches a
      filesystem File/stream constructor (OWASP A03:2021, CWE-22: Path
      Traversal). An attacker (a malicious app sending the Intent, or a
      remote HTTP client) can supply "../" sequences to escape the
      intended directory and read or write files elsewhere on disk. On
      Android, resolve against a fixed base directory (e.g.
      context.filesDir) and take File(name).name to strip any path
      components before use; on the server, resolve + canonicalize
      against a fixed base and verify the result still starts with that
      base before touching the filesystem.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [22]
      owasp: "A03:2021"
      confidence: high
      concept: file_upload_path
      since: "0.1.0"
