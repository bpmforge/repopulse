rules:
  - id: bpm-owasp-a09-sensitive-data-logged-php
    languages: [php]
    severity: WARNING
    message: >
      A password/token/secret field is passed directly into a PSR-3
      logger call (OWASP A09:2021, CWE-532: Insertion of Sensitive
      Information into Log File). Logs are frequently shipped to
      third-party aggregators, retained far longer than the credential's
      validity, and readable by anyone with log access — this is a
      durable credential leak, not just a stray print. Remove the field
      from the context array or redact it (e.g. `'password' =>
      '[REDACTED]'`) before logging.
    patterns:
      - pattern-either:
          - pattern: $LOGGER->info($MSG, $ARR)
          - pattern: $LOGGER->notice($MSG, $ARR)
          - pattern: $LOGGER->warning($MSG, $ARR)
          - pattern: $LOGGER->error($MSG, $ARR)
          - pattern: $LOGGER->debug($MSG, $ARR)
          - pattern: $LOGGER->critical($MSG, $ARR)
      - metavariable-pattern:
          metavariable: $ARR
          patterns:
            - pattern-either:
                - pattern: '[..., "password" => $P, ...]'
                - pattern: "[..., 'password' => $P, ...]"
                - pattern: '[..., "token" => $P, ...]'
                - pattern: "[..., 'token' => $P, ...]"
                - pattern: '[..., "secret" => $P, ...]'
                - pattern: "[..., 'secret' => $P, ...]"
    metadata:
      license: MIT
      provenance: authored
      cwe: [532]
      owasp: "A09:2021"
      confidence: medium
      concept: logging_audit
      since: "0.1.0"
