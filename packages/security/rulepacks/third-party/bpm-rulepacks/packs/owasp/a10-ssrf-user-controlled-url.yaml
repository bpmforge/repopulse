rules:
  - id: bpm-owasp-a10-ssrf-user-controlled-url
    languages: [typescript, javascript]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: req.body.$X
      - pattern: req.query.$X
    pattern-sinks:
      - pattern: axios.get($SINK, ...)
      - pattern: axios.post($SINK, ...)
      - pattern: fetch($SINK, ...)
      - pattern: http.get($SINK, ...)
    message: >
      A URL derived from request input reaches an outbound HTTP call
      (OWASP A10:2021, CWE-918: Server-Side Request Forgery (SSRF)). An
      attacker can point this at internal services (databases, admin
      panels) or cloud metadata endpoints (169.254.169.254) that are
      unreachable from outside the network, exfiltrating credentials or
      pivoting past the perimeter. Validate the URL's host against an
      explicit allowlist resolved *after* DNS lookup, and reject
      private/link-local IP ranges.
    metadata:
      license: MIT
      provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A10"
      cwe: [918]
      owasp: "A10:2021"
      confidence: medium
      concept: ssrf_outbound
      since: "0.1.0"
