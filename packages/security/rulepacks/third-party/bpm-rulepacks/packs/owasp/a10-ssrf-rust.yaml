rules:
  - id: bpm-owasp-a10-ssrf-rust
    languages: [rust]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.query_string()
      - pattern: $REQ.match_info().get($X)
    pattern-sanitizers:
      - patterns:
          - pattern: $X
          - pattern-inside: |
              let $PARSED = Url::parse($X).$UNWRAP(...);
              ...
              if !$ALLOW.contains(&$PARSED.host_str().$UNWRAP2(...)) { ... }
              ...
    pattern-sinks:
      - pattern: reqwest::get($SINK)
      - pattern: $CLIENT.get($SINK).send()
      - pattern: $CLIENT.post($SINK, ...).send()
    message: >
      A URL derived from HTTP request input reaches an outbound reqwest call
      (OWASP A10:2021, CWE-918: Server-Side Request Forgery (SSRF)). An
      attacker can point this at internal services (databases, admin panels)
      or the cloud metadata endpoint (169.254.169.254) that are unreachable
      from outside the network, exfiltrating credentials or pivoting past
      the perimeter. Validate the URL's host against an explicit allowlist
      resolved *after* DNS lookup, and reject private/link-local IP ranges
      before issuing the request. Both the url::Url::parse and the
      allowlist .contains() check must be present — parsing alone (or an
      allowlist check that never runs) still leaves this rule flagging the
      call, by design.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [918]
      owasp: "A10:2021"
      confidence: medium
      concept: ssrf_outbound
      since: "0.1.0"
