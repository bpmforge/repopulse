rules:
  - id: bpm-owasp-a03-sql-injection-php
    languages: [php]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sinks:
      - pattern: mysqli_query($CONN, $SINK)
      - pattern: mysql_query($SINK)
      - pattern: $PDO->query($SINK)
      - pattern: $PDO->exec($SINK)
    message: >
      Unsanitized $_GET/$_POST/$_REQUEST input reaches mysqli_query(),
      mysql_query(), or PDO::query()/exec() as the SQL text (OWASP
      A03:2021, CWE-89: SQL Injection). An attacker who controls this
      value can alter the query's structure to read, modify, or delete
      data outside the intended scope. Use a parameterized query
      (mysqli prepare()/bind_param() or PDO prepare() with bound
      placeholders) instead of concatenating request data into the SQL
      string.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
