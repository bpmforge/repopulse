rules:
  - id: bpm-owasp-a03-code-injection-python
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: request.args.$X
      - pattern: request.args.get(...)
      - pattern: request.form.$X
      - pattern: request.form.get(...)
      - pattern: request.values.$X
      - pattern: request.values.get(...)
      - pattern: request.GET.$X
      - pattern: request.GET.get(...)
      - pattern: request.POST.$X
      - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern: ast.literal_eval(...)
    pattern-sinks:
      - pattern: eval($SINK)
      - pattern: exec($SINK)
      - pattern: compile($SINK, $FILENAME, $MODE)
    message: >
      Unsanitized Flask (request.args/form/values) or Django (request.GET/POST)
      input reaches eval(), exec(), or compile() and is executed as Python
      code (OWASP A03:2021, CWE-94: Code Injection). An attacker who
      controls this value gets arbitrary code execution with the
      application's privileges — this is strictly worse than SQL injection
      or XSS. Never build a code string from request data; if only a literal
      data value is needed, use ast.literal_eval() (which rejects anything
      but literals — no function calls, no attribute access), or dispatch to
      a fixed allowlist of handlers keyed by a validated action name instead
      of evaluating dynamic code.
    metadata:
      license: MIT
      provenance: authored
      cwe: [94]
      owasp: "A03:2021"
      confidence: high
      concept: command_execution
      since: "0.1.0"
