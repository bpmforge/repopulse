rules:
  - id: bpm-owasp-a03-command-injection-rust
    languages: [rust]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.query_string()
      - pattern: $REQ.match_info().get($X)
    pattern-sanitizers:
      - patterns:
          - pattern: $SAN.parse::<$T>()
          - metavariable-regex:
              metavariable: $T
              regex: '^(u8|u16|u32|u64|u128|usize|bool)$'
    pattern-sinks:
      - pattern: Command::new($SINK)
      - pattern: $CMD.arg($SINK)
    message: >
      Unsanitized HTTP request input reaches std::process::Command::new or
      .arg (OWASP A03:2021, CWE-78: OS Command Injection). Command does not
      invoke a shell, but an attacker-controlled argument can still redirect
      the command to an unintended executable, path, or flag (e.g. supplying
      a value starting with `-` to pivot to arbitrary flags). Validate the
      value against a strict allowlist of expected arguments before passing
      it to Command::new/.arg, or type-coerce it (e.g. `.parse::<u32>()`) so
      only the constrained shape can reach the sink.
    metadata:
      license: MIT
      provenance: authored
      cwe: [78]
      owasp: "A03:2021"
      confidence: high
      concept: command_execution
      since: "0.1.0"
