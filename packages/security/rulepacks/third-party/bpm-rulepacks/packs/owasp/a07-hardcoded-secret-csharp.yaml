rules:
  - id: bpm-owasp-a07-hardcoded-secret-csharp
    languages: [csharp]
    severity: WARNING
    message: >
      A security-sensitive value (password, API key, secret, token, or a
      database connection string) is assigned a literal string directly in
      C# source (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials).
      Anyone with source or decompiled-binary access recovers the live
      credential. Load the value from `IConfiguration`/`appsettings.json`
      backed by a secrets manager (Azure Key Vault, AWS Secrets Manager) or
      an environment variable, never a literal, and rotate any credential
      that was ever committed.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: var $VAR = $VAL;
              - pattern: $VAR = $VAL;
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i)(password|pwd|api[_-]?key|apikey|secret|accesstoken|access_token)'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern-either:
              - pattern: var $VAR = $VAL;
              - pattern: $VAR = $VAL;
          - metavariable-regex:
              metavariable: $VAL
              regex: '(?i)^".*(password|pwd)\s*=\s*[^"]{6,}.*"$'
    metadata:
      license: MIT
      provenance: authored
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
