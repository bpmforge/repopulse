rules:
  - id: bpm-owasp-a03-code-injection-ruby
    languages: [ruby]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: params[$X]
      - pattern: params.$X
    pattern-sinks:
      - pattern: eval($SINK)
      - pattern: instance_eval($SINK)
      - pattern: class_eval($SINK)
      - pattern: module_eval($SINK)
    message: >
      Unsanitized params[] input reaches eval(), instance_eval(),
      class_eval(), or module_eval() and is executed as Ruby code (OWASP
      A03:2021, CWE-94: Code Injection). An attacker who controls this
      value gets arbitrary code execution with the application's
      privileges — this is strictly worse than SQL injection or XSS.
      Never build a code string from request data; dispatch to a fixed
      allowlist of handlers (e.g. a Hash of Procs keyed by a validated
      action name) instead of evaluating dynamic code.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [94]
      owasp: "A03:2021"
      confidence: high
      concept: command_execution
      since: "0.1.0"
