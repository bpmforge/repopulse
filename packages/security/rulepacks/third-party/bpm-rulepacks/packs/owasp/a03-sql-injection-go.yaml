rules:
  - id: bpm-owasp-a03-sql-injection-go
    languages: [go]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.URL.Query().Get($X)
      - pattern: $REQ.FormValue($X)
      - pattern: $REQ.PostFormValue($X)
    pattern-propagators:
      - pattern: fmt.Sprintf($FMT, ...)
        from: $FMT
        to: $FMT
    pattern-sinks:
      - pattern: $DB.Query($SINK)
      - pattern: $DB.QueryContext($CTX, $SINK)
      - pattern: $DB.QueryRow($SINK)
      - pattern: $DB.QueryRowContext($CTX, $SINK)
      - pattern: $DB.Exec($SINK)
      - pattern: $DB.ExecContext($CTX, $SINK)
    message: >
      Unsanitized HTTP request input reaches a database/sql Query/Exec call
      as the SQL text, either via fmt.Sprintf interpolation or direct string
      concatenation (OWASP A03:2021, CWE-89: SQL Injection). An attacker who
      controls this value can alter the query's structure to read, modify,
      or delete data outside the intended scope. Use a parameterized query
      (`?`/`$1` placeholders passed as separate Query/Exec arguments) instead
      of building the SQL string from request data.
    metadata:
      license: MIT
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
