rules:
  - id: bpm-owasp-a03-sql-injection-vbnet
    languages: [vb]
    severity: ERROR
    message: >
      A SqlCommand's query text is built via string concatenation (&)
      instead of parameterized query text, either at the SqlCommand
      constructor or via a later CommandText assignment (OWASP A03:2021,
      CWE-89: SQL Injection). An attacker who controls a value folded into
      the query this way can alter its structure to read, modify, or
      delete data outside the intended scope. Use parameter placeholders
      (`@id`) plus `cmd.Parameters.AddWithValue(...)` /
      `cmd.Parameters.Add(...)` so ADO.NET sends the value out-of-band
      from the query text.
    pattern-either:
      - pattern: New SqlCommand($A & $B, $CONN)
      - pattern: New SqlCommand($A & $B)
      - pattern: $CMD.CommandText = $A & $B
    metadata:
      license: proprietary
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
