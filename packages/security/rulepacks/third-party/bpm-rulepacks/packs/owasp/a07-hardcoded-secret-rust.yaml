rules:
  - id: bpm-owasp-a07-hardcoded-secret-rust
    languages: [rust]
    severity: WARNING
    message: >
      A security-sensitive value (password, API key, secret, or token) is
      assigned a string literal directly in Rust source (OWASP A07:2021,
      CWE-798: Use of Hard-coded Credentials). rustc compiles string
      literals into the binary's rodata section in plaintext, so anyone
      with source or binary access (`strings`) recovers the live
      credential. Load the value from `std::env::var`, a secrets manager,
      or an injected config struct instead of a literal, and rotate any
      credential that was ever committed.
    pattern-either:
      - patterns:
          - pattern: let $VAR = $VAL;
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i).*(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: let $VAR = $VAL.to_string();
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i).*(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: let $VAR = $VAL.to_owned();
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i).*(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: let $VAR = String::from($VAL);
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i).*(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token).*'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: std::env::set_var($KEY, $VAL);
          - metavariable-regex:
              metavariable: $KEY
              regex: '(?i)"(.*(password|pwd|api[_-]?key|apikey|secret|token).*)"'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: env::set_var($KEY, $VAL);
          - metavariable-regex:
              metavariable: $KEY
              regex: '(?i)"(.*(password|pwd|api[_-]?key|apikey|secret|token).*)"'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - pattern-regex: '(?i)\b(password|pwd|api[_-]?key|apikey|secret|token|access_token)\s*:\s*"[^"]*"(\.to_string\(\)|\.to_owned\(\))?\s*,?\s*$'
    metadata:
      license: MIT
      provenance: authored
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
