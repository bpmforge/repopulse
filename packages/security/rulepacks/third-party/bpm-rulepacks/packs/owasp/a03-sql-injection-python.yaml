rules:
  - id: bpm-owasp-a03-sql-injection-python
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: request.args.$X
      - pattern: request.args.get(...)
      - pattern: request.form.$X
      - pattern: request.form.get(...)
      - pattern: request.values.$X
      - pattern: request.values.get(...)
      - pattern: request.GET.$X
      - pattern: request.GET.get(...)
      - pattern: request.POST.$X
      - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
    pattern-sinks:
      - pattern: $CURSOR.execute($SINK)
      - pattern: $CURSOR.executemany($SINK, ...)
      - pattern: sqlalchemy.text($SINK)
      - pattern: text($SINK)
      - pattern: $CONN.execute($SINK)
    message: >
      Unsanitized Flask (request.args/form/values) or Django (request.GET/POST)
      input reaches a DB-API cursor.execute()/executemany() call, a raw
      Connection.execute(), or SQLAlchemy text() as the SQL text — typically
      via f-string interpolation, %-formatting, or string concatenation
      (OWASP A03:2021, CWE-89: SQL Injection). An attacker who controls this
      value can alter the query's structure to read, modify, or delete data
      outside the intended scope. Pass the SQL text as a fixed literal and
      bind the request value as a separate parameter — cursor.execute(sql,
      (value,)) or text(sql).bindparams(value=value) — never interpolate it
      into the SQL string.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
