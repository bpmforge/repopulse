rules:
  - id: bpm-owasp-a07-hardcoded-secret-go
    languages: [go]
    severity: WARNING
    message: >
      A security-sensitive value (password, API key, secret, or token) is
      assigned a literal string directly in Go source (OWASP A07:2021,
      CWE-798: Use of Hard-coded Credentials). Go compiles string constants
      into the binary's rodata section in plaintext, so anyone with source
      or binary access (`strings`) recovers the live credential. Load the
      value from `os.Getenv`, a secrets manager, or an injected config
      struct instead of a literal, and rotate any credential that was ever
      committed.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $VAR := $VAL
              - pattern: $VAR = $VAL
              - pattern: const $VAR = $VAL
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i)(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token)'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: '$STRUCT{..., $FIELD: $VAL, ...}'
          - metavariable-regex:
              metavariable: $FIELD
              regex: '(?i)(password|pwd|api[_-]?key|apikey|secret|token|accesstoken|access_token)'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
      - patterns:
          - pattern: os.Setenv($KEY, $VAL)
          - metavariable-regex:
              metavariable: $KEY
              regex: '(?i)"(.*(password|pwd|api[_-]?key|apikey|secret|token).*)"'
          - metavariable-regex:
              metavariable: $VAL
              regex: '^"[^"]*"$'
    metadata:
      license: proprietary
      provenance: authored
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
