rules:
  - id: bpm-owasp-a03-path-traversal-python
    languages: [python]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: request.args.$X
      - pattern: request.args.get(...)
      - pattern: request.form.$X
      - pattern: request.form.get(...)
      - pattern: request.values.$X
      - pattern: request.values.get(...)
      - pattern: request.GET.$X
      - pattern: request.GET.get(...)
      - pattern: request.POST.$X
      - pattern: request.POST.get(...)
    pattern-sanitizers:
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: secure_filename(...)
      - pattern: os.path.basename(...)
    pattern-sinks:
      - pattern: open($SINK)
      - pattern: open($SINK, $MODE)
      - pattern: os.path.join($BASE, $SINK)
      - pattern: os.remove($SINK)
      - pattern: os.rename($SINK, $DST)
      - pattern: shutil.copy($SINK, $DST)
    message: >
      Unsanitized Flask (request.args/form/values) or Django (request.GET/POST)
      input reaches open(), os.path.join(), os.remove(), os.rename(), or
      shutil.copy() as a path component (OWASP A03:2021, CWE-22: Path
      Traversal). An attacker can supply "../" sequences to escape the
      intended directory and read, overwrite, or delete files elsewhere on
      disk. Reduce the value to its basename with
      werkzeug.utils.secure_filename() (Flask) or os.path.basename() before
      joining it to a base directory, then verify the resolved path
      (os.path.realpath) still starts with that base directory before any
      filesystem call.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [22]
      owasp: "A03:2021"
      confidence: high
      concept: file_upload_path
      since: "0.1.0"
