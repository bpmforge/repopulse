rules:
  - id: bpm-owasp-a07-plaintext-password-compare
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      A user's stored password is compared directly with `===`/`==` against
      request input (OWASP A07:2021, CWE-256: Plaintext Storage of a Password).
      A direct equality check on `.password` only works if the password is
      stored in plaintext, and even against a hash it is not constant-time
      (timing side channel). Store passwords with bcrypt/argon2 and compare via
      the library's constant-time compare function (e.g. bcrypt.compare()).
    pattern-either:
      - pattern: $USER.password === $INPUT
      - pattern: $USER.password == $INPUT
    metadata:
      license: proprietary
      provenance: "ported:bpm-opencode-experts/OWASP_METHODOLOGY A07"
      cwe: [256]
      owasp: "A07:2021"
      confidence: medium
      concept: password_storage
      since: "0.1.0"
