rules:
  - id: bpm-owasp-a07-hardcoded-secret-php
    languages: [php]
    severity: WARNING
    message: >
      A security-sensitive value (password, API key, secret, or token) is
      assigned a literal string directly in PHP source, or a database
      connection is opened with a literal password (mysqli_connect()/`new
      PDO()`) (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials).
      Anyone with source or deployed-file access recovers the live
      credential, and it persists in version-control history even after
      removal. Load the value from an environment variable (getenv()/
      $_ENV), a `.env` file read via a library like vlucas/phpdotenv, or a
      secrets manager, never a literal, and rotate any credential that was
      ever committed.
    pattern-either:
      - patterns:
          - pattern: $VAR = $VAL;
          - metavariable-regex:
              metavariable: $VAR
              regex: '(?i)\$?(password|pwd|api[_-]?key|apikey|secret|token)'
          - metavariable-regex:
              metavariable: $VAL
              regex: "^['\"][^'\"]*['\"]$"
      - patterns:
          - pattern-either:
              - pattern: mysqli_connect($HOST, $USER, $PASS, ...)
              - pattern: new PDO($DSN, $USER, $PASS, ...)
          - metavariable-regex:
              metavariable: $PASS
              regex: "^['\"][^'\"]*['\"]$"
    metadata:
      license: proprietary
      provenance: authored
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
