rules:
  - id: bpm-owasp-a07-hardcoded-secret-kotlin
    languages: [kotlin]
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: val $VAR = $VAL
          - pattern: var $VAR = $VAL
          - pattern: "val $VAR: $TYPE = $VAL"
          - pattern: "var $VAR: $TYPE = $VAL"
      - metavariable-regex:
          metavariable: $VAR
          regex: '(?i)(password|passwd|pwd|api[_-]?key|apikey|secret|accesstoken|access_token|authtoken|auth_token)'
      - metavariable-regex:
          metavariable: $VAL
          regex: '^"[^"]*"$'
    message: >
      A property or variable whose name signals a credential (password,
      apiKey, secret, token) is initialized with a literal string in
      Kotlin (OWASP A07:2021, CWE-798: Use of Hard-coded Credentials).
      Anyone with source or decompiled-APK access (a Kotlin/Android app's
      bytecode is trivially decompiled with jadx) recovers the live
      credential, and it stays recoverable in git history even after the
      line is deleted. Load the value from BuildConfig fields populated
      from a non-committed gradle.properties/local.properties, the
      Android Keystore, EncryptedSharedPreferences, or a remote secrets
      manager — never a source literal — and rotate any credential that
      was ever committed.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [798]
      owasp: "A07:2021"
      confidence: medium
      concept: secrets_config
      since: "0.1.0"
