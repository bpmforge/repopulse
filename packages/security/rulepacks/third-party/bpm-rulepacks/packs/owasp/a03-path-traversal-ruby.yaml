rules:
  - id: bpm-owasp-a03-path-traversal-ruby
    languages: [ruby]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: params[$X]
      - pattern: params.$X
    pattern-sanitizers:
      - pattern: File.basename(...)
    pattern-sinks:
      - pattern: File.read($SINK)
      - pattern: File.open($SINK)
      - pattern: File.open($SINK, $MODE)
      - pattern: File.write($SINK, $DATA)
      - pattern: IO.read($SINK)
      - pattern: open($SINK)
    message: >
      Unsanitized params[] input reaches File.read(), File.open(),
      File.write(), IO.read(), or Kernel#open() as the filesystem path
      (OWASP A03:2021, CWE-22: Path Traversal). An attacker can supply
      `../` sequences to read or write files outside the intended
      directory — and Kernel#open() additionally treats a leading `|` as
      a command-execution prefix, compounding this into command
      injection. Strip the request value to a bare filename with
      File.basename() before joining it to a fixed base directory, or
      verify the resolved File.expand_path() still starts with that base
      directory before reading.
    metadata:
      license: MIT
      provenance: authored
      cwe: [22]
      owasp: "A03:2021"
      confidence: high
      concept: file_upload_path
      since: "0.1.0"
