rules:
  - id: bpm-owasp-a03-sql-injection-ruby
    languages: [ruby]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: params[$X]
      - pattern: params.$X
    pattern-sanitizers:
      - pattern: $CONN.quote(...)
      - pattern: ActiveRecord::Base.sanitize_sql_array(...)
    pattern-sinks:
      - pattern: $CONN.execute($SINK)
      - pattern: ActiveRecord::Base.connection.execute($SINK)
      - pattern: $CONN.exec_query($SINK)
      - pattern: $MODEL.find_by_sql($SINK)
      - pattern: $MODEL.where($SINK)
    message: >
      Unsanitized params[] input reaches a raw execute()/exec_query() call,
      find_by_sql(), or a where() call built from an interpolated string
      (OWASP A03:2021, CWE-89: SQL Injection). ActiveRecord only
      parameterizes query methods when the value is passed as a separate
      bind argument or hash; a string assembled with Ruby interpolation and
      handed to execute/where/find_by_sql lands in the generated SQL
      unescaped. An attacker who controls this value can alter the query's
      structure to read, modify, or delete data outside the intended scope.
      Use a parameterized query (`?`/named placeholder with bind arguments,
      or the where(column: value) hash form) instead of interpolating
      request data into the SQL string.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [89]
      owasp: "A03:2021"
      confidence: high
      concept: sql_database
      since: "0.1.0"
