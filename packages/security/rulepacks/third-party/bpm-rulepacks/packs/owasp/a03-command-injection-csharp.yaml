rules:
  - id: bpm-owasp-a03-command-injection-csharp
    languages: [csharp]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.QueryString[$X]
      - pattern: $REQ.Form[$X]
      - pattern: $REQ.Params[$X]
    pattern-sinks:
      - pattern: Process.Start($SINK)
      - pattern: Process.Start($SINK, $ARGS)
    message: >
      Unsanitized ASP.NET request input (QueryString/Form/Params) reaches
      Process.Start() as the executable path or arguments (OWASP A03:2021,
      CWE-78: OS Command Injection). An attacker can supply a path to an
      unintended executable, or shell metacharacters in the arguments, to
      run arbitrary commands with the application's privileges. Never build
      a Process.Start() call from request data; if a subprocess is
      unavoidable, use a ProcessStartInfo with a fixed executable path and
      pass each argument via the ArgumentList collection (never a single
      concatenated Arguments string) against a strict allowlist.
    metadata:
      license: MIT
      provenance: authored
      cwe: [78]
      owasp: "A03:2021"
      confidence: high
      concept: command_execution
      since: "0.1.0"
