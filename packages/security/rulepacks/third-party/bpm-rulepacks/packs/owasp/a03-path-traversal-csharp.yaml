rules:
  - id: bpm-owasp-a03-path-traversal-csharp
    languages: [csharp]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.QueryString[$X]
      - pattern: $REQ.Form[$X]
      - pattern: $REQ.Params[$X]
    pattern-sinks:
      - pattern: File.ReadAllText($SINK)
      - pattern: File.OpenRead($SINK)
      - pattern: File.Open($SINK, $MODE)
      - pattern: new FileStream($SINK, $MODE)
    message: >
      Unsanitized ASP.NET request input (QueryString/Form/Params) reaches
      File.ReadAllText/File.OpenRead/File.Open/FileStream as the path
      (OWASP A03:2021, CWE-22: Path Traversal). An attacker can supply
      "../" sequences or an absolute path to escape the intended directory
      and read or write files elsewhere on disk. Resolve the value against
      a fixed base directory with Path.GetFullPath and verify the result
      still starts with that base directory's canonical path before using
      it in any filesystem call — or better, map the request value through
      a server-side allowlist of known filenames instead of using it as a
      path directly.
    metadata:
      license: MIT
      provenance: authored
      cwe: [22]
      owasp: "A03:2021"
      confidence: high
      concept: file_upload_path
      since: "0.1.0"
