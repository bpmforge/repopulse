rules:
  - id: bpm-owasp-a07-plaintext-password-compare-csharp
    languages: [csharp]
    severity: WARNING
    message: >
      A user's stored password is compared directly with `==`/`.Equals()`
      against request input (OWASP A07:2021, CWE-256: Plaintext Storage of a
      Password). A direct equality check on `.Password` only works if the
      password is stored in plaintext, and even against a hash it is not
      constant-time (timing side channel). Store passwords hashed with
      `Rfc2898DeriveBytes`/BCrypt.Net/argon2 and compare via the library's
      constant-time verify function (e.g. `BCrypt.Verify()` or
      `CryptographicOperations.FixedTimeEquals()`).
    pattern-either:
      - pattern: $USER.Password == $INPUT
      - pattern: $USER.Password.Equals($INPUT)
    metadata:
      license: MIT
      provenance: authored
      cwe: [256]
      owasp: "A07:2021"
      confidence: medium
      concept: password_storage
      since: "0.1.0"
