rules:
  - id: bpm-owasp-a03-xss-php
    languages: [php]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
    pattern-sanitizers:
      - pattern: htmlspecialchars(...)
      - pattern: htmlentities(...)
    pattern-sinks:
      - pattern: echo $SINK;
      - pattern: print $SINK;
    message: >
      Unsanitized $_GET/$_POST/$_REQUEST input reaches echo or print
      without escaping (OWASP A03:2021, CWE-79: Cross-Site Scripting).
      An attacker can inject a `<script>` tag or event-handler attribute
      that runs in the victim's browser session. Escape with
      htmlspecialchars($value, ENT_QUOTES, 'UTF-8') (or htmlentities())
      before echoing any request-derived value into HTML output.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [79]
      owasp: "A03:2021"
      confidence: high
      concept: input_validation
      since: "0.1.0"
