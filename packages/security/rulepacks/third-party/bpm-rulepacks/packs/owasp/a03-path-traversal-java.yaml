rules:
  - id: bpm-owasp-a03-path-traversal-java
    languages: [java]
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: $REQ.getParameter($X)
      - pattern: $REQ.getHeader($X)
      - pattern: $REQ.getQueryString()
    pattern-sinks:
      - pattern: new java.io.File($SINK)
      - pattern: new java.io.FileInputStream($SINK)
      - pattern: new java.io.FileOutputStream($SINK)
      - pattern: new java.io.FileReader($SINK)
      - pattern: new java.io.FileWriter($SINK)
    message: >
      Unsanitized servlet request input reaches a filesystem File/stream
      constructor (OWASP A03:2021, CWE-22: Path Traversal). An attacker can
      supply "../" sequences to escape the intended directory and read or
      write files elsewhere on disk. Resolve against a fixed base directory
      (path.normalize + a startsWith check on the resolved canonical path)
      before using the value in any filesystem call.
    metadata:
      license: proprietary
      provenance: authored
      cwe: [22]
      owasp: "A03:2021"
      confidence: high
      concept: file_upload_path
      since: "0.1.0"
