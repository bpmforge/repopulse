rules:
  - id: bpm-owasp-a02-weak-cipher-vbnet
    languages: [vb]
    severity: WARNING
    message: >
      A broken symmetric cipher (DES/TripleDES) is instantiated (OWASP
      A02:2021, CWE-327: Use of a Broken or Risky Cryptographic Algorithm).
      DES/3DES have a 56/112-bit effective key space, both practically
      brute-forceable today. Use AES with CBC (with a random IV and MAC)
      or an AEAD mode (GCM/ChaCha20-Poly1305) instead.
    pattern-either:
      - pattern: New DESCryptoServiceProvider()
      - pattern: New TripleDESCryptoServiceProvider()
    metadata:
      license: MIT
      provenance: authored
      cwe: [327]
      owasp: "A02:2021"
      confidence: high
      concept: cryptography
      since: "0.1.0"
