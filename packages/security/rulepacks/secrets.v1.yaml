# RepoPulse secrets rulepack v1 (W8-04, SECURITY_SUITE.md 3.1, FR-SEC-3).
#
# "gitleaks-compatible" means the FIELD NAMES below are gitleaks' own
# (id / description / regex / entropy / keywords / allowlist), so a detector
# written for gitleaks ports across by copying it. It does NOT mean this file
# can be fed to the gitleaks binary: gitleaks' own config is TOML, and
# SECURITY_SUITE.md names this asset secrets.v{N}.yaml. Saying "compatible"
# without that sentence would send someone to try `gitleaks -c secrets.v1.yaml`.
#
# TruffleHog's corpus is deliberately NOT used: it is AGPL-3.0 and cannot be
# vendored into a proprietary rulepack (CPU_FIRST_OFFLOAD 2026-07-16 s4).
#
# Every rule states what it costs to be wrong. A false negative here is a live
# credential nobody was told about; a false positive is a person interrupted.
# Both are real, which is why entropy floors exist on the generic rules and not
# on the prefixed ones - a string starting with ghp_ is not a coincidence.
version: 1
rules:
  - id: aws-access-key-id
    description: AWS access key ID
    kind: aws
    severity: 5
    regex: '\b((?:AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16})\b'
    keywords:
      - AKIA
      - ASIA

  - id: aws-secret-access-key
    description: AWS secret access key
    kind: aws
    severity: 5
    # Only in an assignment: 40 base64-ish characters on their own are a hash,
    # a checksum or a minified line far more often than a key.
    regex: '(?i)aws[_.-]?(?:secret|sk)[_.-]?(?:access)?[_.-]?key["\s:=]{1,10}([A-Za-z0-9/+=]{40})'
    entropy: 4.2

  - id: github-pat
    description: GitHub personal access token
    kind: github
    severity: 5
    regex: '\b(gh[pousr]_[A-Za-z0-9]{36})\b'
    keywords:
      - ghp_
      - gho_
      - ghu_
      - ghs_
      - ghr_

  - id: github-fine-grained-pat
    description: GitHub fine-grained personal access token
    kind: github
    severity: 5
    regex: '\b(github_pat_[A-Za-z0-9_]{70,90})\b'
    keywords:
      - github_pat_

  - id: gitlab-pat
    description: GitLab personal access token
    kind: gitlab
    severity: 5
    regex: '\b(glpat-[A-Za-z0-9\-_]{20})\b'
    keywords:
      - glpat-

  - id: gitea-token
    description: Gitea access token in an assignment
    kind: gitea
    severity: 4
    regex: '(?i)gitea[_.-]?(?:api[_.-]?)?token["\s:=]{1,10}([a-f0-9]{40})'
    entropy: 3.0

  - id: slack-token
    description: Slack API token
    kind: slack
    severity: 4
    regex: '\b(xox[abprs]-[0-9A-Za-z\-]{10,72})\b'
    keywords:
      - xoxb-
      - xoxp-
      - xoxa-
      - xoxr-
      - xoxs-

  - id: stripe-secret-key
    description: Stripe secret key
    kind: stripe
    severity: 5
    # Issued keys are base62 after the prefix, but hand-made, rotated or fake
    # ones copied into code often carry underscores (the W18-17 benchmark
    # missed SampleCo's `sk_live_..._DO_NOT_USE_...` this way), so the body
    # may contain `_`. That also lets snake_case names with the prefix match
    # (`sk_live_webhook_endpoint_secret`), which the allowlist turns away:
    # a body made of snake_case, SCREAMING_CASE or camelCase words joined by
    # `_` is a name, not a key.
    regex: '\b(sk_(?:live|test)_[A-Za-z0-9][A-Za-z0-9_]{22,97}[A-Za-z0-9])\b'
    keywords:
      - sk_live_
      - sk_test_
    allowlist:
      - '^sk_(?:live|test)_[a-z0-9]+(?:_[a-z0-9]+)+$'
      - '^sk_(?:live|test)_[A-Z0-9]+(?:_[A-Z0-9]+)+$'
      - '^sk_(?:live|test)_[a-z]+(?:[A-Z][a-z0-9]*)*(?:_[a-z]+(?:[A-Z][a-z0-9]*)*)+$'

  - id: anthropic-api-key
    description: Anthropic API key
    kind: anthropic
    severity: 5
    regex: '\b(sk-ant-[A-Za-z0-9\-_]{20,120})\b'
    keywords:
      - sk-ant-

  - id: openai-api-key
    description: OpenAI API key
    kind: openai
    severity: 5
    regex: '\b(sk-(?:proj-)?[A-Za-z0-9]{32,120})\b'
    keywords:
      - sk-
    allowlist:
      # sk-ant- has its own rule and would otherwise be reported twice.
      - 'sk-ant-'

  - id: google-api-key
    description: Google API key
    kind: google
    severity: 4
    regex: '\b(AIza[0-9A-Za-z\-_]{35})\b'
    keywords:
      - AIza

  - id: npm-access-token
    description: npm access token
    kind: npm
    severity: 4
    regex: '\b(npm_[A-Za-z0-9]{36})\b'
    keywords:
      - npm_

  - id: private-key-block
    description: Private key block
    kind: private_key
    severity: 5
    regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'
    keywords:
      - PRIVATE KEY

  - id: jwt
    description: JSON Web Token
    kind: jwt
    severity: 3
    regex: '\b(eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,})\b'
    keywords:
      - eyJ

  - id: generic-secret-assignment
    description: High-entropy value assigned to a secret-looking name
    kind: generic
    severity: 3
    # The catch-all, and the one most likely to be wrong: it needs BOTH a
    # secret-shaped name and a high-entropy value, and it still ranks below the
    # prefixed rules because a UUID in a `token =` line is a common false hit.
    regex: '(?i)(?:api[_.-]?key|secret|passwd|password|token|credential)["\s:=]{1,10}["'']?([A-Za-z0-9/+=_\-]{20,80})["'']?'
    entropy: 4.0
    allowlist:
      - '(?i)(example|sample|dummy|placeholder|changeme|your[_-]?(?:api[_-]?)?key|xxx+|<[^>]+>|\$\{[^}]+\})'
