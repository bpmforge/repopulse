# bpm-rulepacks — injection dataflow: request data reaching a dangerous call
# (W18-33, mechanical-checks plan, Snyk-gap analysis 2026-10-16).
#
# PROVENANCE: written for RepoPulse. Nothing here is copied, adapted or derived
# from the Semgrep registry (DESIGN_REVIEW.md G-18); every rule says so in its
# metadata.
#
# WHAT IS BEING CAUGHT. The injection family — SQL, OS command, path traversal,
# cross-site scripting, server-side request forgery, open redirect and unsafe
# deserialization — is a flow, not a call: `db.query(sql)` is fine, and so is
# `req.query.id`, and the bug is the first fed by the second. So every rule
# here is TAINT mode: a SOURCE (HTTP request data), SANITIZERS (conversions and
# escapes that clean it) and a SINK (where it becomes code, a query, markup, a
# path or a URL). Each rule carries a CWE and an OWASP Top 10 (2021) tag so the
# coverage map can say what is covered by weakness class.
#
# COVERAGE (rule id -> weakness):   js   py   java  go
#   sql           CWE-89            x    x    x     x
#   cmd           CWE-78            x    x    x     x
#   path          CWE-22            x    x    x     x
#   xss           CWE-79            x    x    x     x    (+ dom-xss in the browser, js)
#   ssrf          CWE-918           x    x    x     x
#   redirect      CWE-601           x    x    x     x
#   deserialize   CWE-502                x    x     x    (js has no common sink)
#
# SOURCES name the request object (req/request/ctx, r/c, HttpServletRequest and
# Spring's @RequestParam/@PathVariable/@RequestBody/@RequestHeader), not every
# variable that happens to be called `input`. SANITIZERS are per sink: a number
# conversion cleans every rule, `html.escape` cleans only markup, `basename`
# only a path. An escape for a different sink is not a sanitizer.
#
# LIMITS, stated plainly. The engine follows a value through one function —
# assignments, string building, destructuring. It does not follow it through a
# call to another function, a class field, a queue or a framework's dependency
# injection. A bug that crosses those is missed, not reported wrong. That is
# the reason these ship as candidates and why interprocedural dataflow stays on
# the roadmap rather than being claimed here.
#
# EVERY RULE IS A CANDIDATE (`metadata.lifecycle: candidate`, §8.2): it runs in
# shadow and its findings stay out of scores until an admin promotes it on
# evidence. Test files are excluded.
#
# THE ENGINE IS OPENGREP in production (semgrep-compatible format). Validated at
# authoring time with semgrep 1.181.0 against fixtures/injection/ (W18-33 ticket
# note). Engine behaviour that shaped the patterns:
#   - a pattern containing `: ` (an object literal, a string argument) must be
#     quoted, or the YAML parser reads it as a mapping;
#   - a `metavariable-regex` inside a `patterns:` block applies to the WHOLE
#     block, so a sink that needs a receiver check lives in its own block;
#   - an annotation or constructor is matched as written: `new java.net.URL(x)`
#     does not match `new URL($X)`, so the fixtures import what they use.
rules:
  # ===== JavaScript / TypeScript ============================================
  - id: bpm-inj-sql-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data reaches a SQL query as text. A value spliced into the query
      string is an injection the day it holds a quote. Bind it as a parameter
      (`db.query('... WHERE id = $1', [id])`), or use the query builder's
      bindings.
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      owasp: 'A03:2021 Injection'
      yields: ['sql-injection', 'data-read']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
        Follows the value inside one function and through assignments,
        template strings and concatenation. A value stored in a field or
        returned from another module is not followed.
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.$queryRawUnsafe($Q, ...)
              - pattern: $DB.$executeRawUnsafe($Q, ...)
              - pattern: $DB.unsafe($Q, ...)
              - pattern: $DB.all($Q, ...)
              - pattern: $DB.get($Q, ...)
              - pattern: $DB.run($Q, ...)
              - pattern: $DB.exec($Q, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)(db|pool|client|conn|connection|knex|sequelize|prisma|database|sql|pg|mysql|sqlite|trx|tx|transaction)\w*$
          - focus-metavariable: $Q

  - id: bpm-inj-cmd-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data reaches a shell command. A `;`, `|` or `$(...)` in that
      value runs as a second command on the server. Pass the program and its
      arguments separately with execFile or spawn (no shell), and allowlist the
      values.
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: 'A03:2021 Injection'
      yields: ['rce']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
      - pattern: shellescape(...)
      - pattern: shellQuote.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec($X, ...)
              - pattern: execSync($X, ...)
              - pattern: execAsync($X, ...)
              - pattern: execPromise($X, ...)
              - pattern: execaCommand($X, ...)
              - pattern: execaCommandSync($X, ...)
              - pattern: require('child_process').$CPF($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $CP.$CPF($X, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: (?i)^(child_?process|cp)$
          - metavariable-regex:
              metavariable: $CPF
              regex: ^(exec|execSync)$
          - focus-metavariable: $X
      - patterns:
          - pattern-either:
              - pattern: 'spawn($CMD, ..., {..., shell: true, ...})'
              - pattern: 'spawnSync($CMD, ..., {..., shell: true, ...})'
              - pattern: '$CP.spawn($CMD, ..., {..., shell: true, ...})'
              - pattern: '$CP.spawnSync($CMD, ..., {..., shell: true, ...})'
          - focus-metavariable: $CMD

  - id: bpm-inj-path-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data reaches a file path. `../` in that value reads or writes
      files outside the folder you meant. Reduce it to a file name with
      path.basename, or resolve it and check the result still starts with the
      allowed directory.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: 'A01:2021 Broken Access Control'
      yields: ['path-traversal', 'data-read']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
      - pattern: path.basename(...)
      - pattern: $P.basename(...)
      - pattern: sanitize(...)
      - pattern: sanitizeFilename(...)
      - pattern: secureJoin(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.readFile($X, ...)
              - pattern: fs.readFileSync($X, ...)
              - pattern: fs.createReadStream($X, ...)
              - pattern: fs.writeFile($X, ...)
              - pattern: fs.writeFileSync($X, ...)
              - pattern: fs.createWriteStream($X, ...)
              - pattern: fs.unlink($X, ...)
              - pattern: fs.unlinkSync($X, ...)
              - pattern: fs.rm($X, ...)
              - pattern: fs.rmSync($X, ...)
              - pattern: fs.readdir($X, ...)
              - pattern: fs.readdirSync($X, ...)
              - pattern: fs.promises.readFile($X, ...)
              - pattern: fs.promises.writeFile($X, ...)
              - pattern: $RES.sendFile($X, ...)
              - pattern: $RES.download($X, ...)
          - focus-metavariable: $X

  - id: bpm-inj-xss-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data is written into an HTML response unescaped. A `<script>` in
      that value runs in every visitor's browser. Escape it for HTML, render it
      through a template engine that escapes by default, or send JSON.
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: 'A03:2021 Injection'
      yields: ['xss']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
      - pattern: escapeHtml(...)
      - pattern: escape(...)
      - pattern: he.escape(...)
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: xss(...)
      - pattern: encodeURIComponent(...)
      - pattern: JSON.stringify(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($X)
              - pattern: $RES.write($X)
              - pattern: $RES.end($X)
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|reply|response)$
          - focus-metavariable: $X

  - id: bpm-inj-dom-xss-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Text from the page address or window reaches an HTML sink in the
      browser. A crafted link runs script as the signed-in user. Set
      `textContent`, or sanitize with DOMPurify before using innerHTML.
    metadata:
      category: security
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: 'A03:2021 Injection'
      yields: ['xss']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      - pattern: location.hash
      - pattern: location.search
      - pattern: location.href
      - pattern: window.location.hash
      - pattern: window.location.search
      - pattern: window.location.href
      - pattern: document.location.hash
      - pattern: document.location.search
      - pattern: document.URL
      - pattern: document.referrer
      - pattern: window.name
      - pattern: new URLSearchParams(...).get(...)
      - pattern: $SP.get(...)
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: escapeHtml(...)
      - pattern: encodeURIComponent(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $X
              - pattern: $EL.outerHTML = $X
              - pattern: document.write($X)
              - pattern: document.writeln($X)
              - pattern: $EL.insertAdjacentHTML($POS, $X)
              - pattern: '<$T dangerouslySetInnerHTML={{__html: $X}} />'
          - focus-metavariable: $X

  - id: bpm-inj-ssrf-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data decides which URL the server fetches. A caller can point it
      at the cloud metadata service or an internal host. Allowlist the hosts,
      or take only a path or id from the request and build the URL yourself.
    metadata:
      category: security
      cwe: 'CWE-918: Server-Side Request Forgery (SSRF)'
      owasp: 'A10:2021 Server-Side Request Forgery'
      yields: ['ssrf']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
      - pattern: isAllowedUrl(...)
      - pattern: isAllowedHost(...)
      - pattern: assertAllowedUrl(...)
      - pattern: validateUrl(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($X, ...)
              - pattern: axios($X, ...)
              - pattern: axios.get($X, ...)
              - pattern: axios.post($X, ...)
              - pattern: axios.put($X, ...)
              - pattern: axios.delete($X, ...)
              - pattern: 'axios.request({..., url: $X, ...})'
              - pattern: got($X, ...)
              - pattern: got.get($X, ...)
              - pattern: got.post($X, ...)
              - pattern: request($X, ...)
              - pattern: request.get($X, ...)
              - pattern: http.get($X, ...)
              - pattern: https.get($X, ...)
              - pattern: http.request($X, ...)
              - pattern: https.request($X, ...)
              - pattern: needle($M, $X, ...)
              - pattern: superagent.get($X)
          - focus-metavariable: $X

  - id: bpm-inj-redirect-js
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Request data decides where the user is redirected. A phishing link on
      your domain can send visitors anywhere. Redirect only to a path that
      starts with a single `/`, or to an allowlisted host.
    metadata:
      category: security
      cwe: "CWE-601: URL Redirection to Untrusted Site ('Open Redirect')"
      owasp: 'A01:2021 Broken Access Control'
      yields: ['open-redirect']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # HTTP request data (express, fastify, koa, node:http).
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.url
              - pattern: $REQ.originalUrl
              - pattern: $REQ.path
              - pattern: $REQ.hostname
              - pattern: $REQ.get(...)
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx\.request|ctx)$
    pattern-sanitizers:
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $A.isInteger(...)
      - pattern: $A.isUUID(...)
      - pattern: $A.isInt(...)
      - pattern: $A.isNumeric(...)
      - pattern: isSafeRedirect(...)
      - pattern: isAllowedRedirect(...)
      - pattern: safeRedirect(...)
      - pattern: encodeURIComponent(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($X)
              - pattern: $RES.redirect($CODE, $X)
              - pattern: $RES.location($X)
              - pattern: "$RES.setHeader('Location', $X)"
              - pattern: "$RES.header('Location', $X)"
          - metavariable-regex:
              metavariable: $RES
              regex: ^(res|reply|response|ctx)$
          - focus-metavariable: $X

  # ===== Python ===============================================================
  - id: bpm-inj-sql-py
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data reaches a SQL query as text. A value formatted into the
      query string is an injection the day it holds a quote. Pass it as a bound
      parameter (`cursor.execute("... WHERE id = %s", (id,))`), or use the ORM's
      filters.
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      owasp: 'A03:2021 Injection'
      yields: ['sql-injection', 'data-read']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
        Follows the value inside one function. A value stored on self or
        returned from another module is not followed, and a FastAPI path or
        query parameter is not a source here.
    paths:
      exclude:
        - 'test_*.py'
        - '*_test.py'
        - 'conftest.py'
        - '**/tests/**'
        - '**/test/**'
    pattern-sources:
      # HTTP request data (flask, django, fastapi/starlette, bottle).
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.cookies
      - pattern: flask.request.headers
      - pattern: flask.request.view_args
      - pattern: flask.request.get_json(...)
      - pattern: request.args
      - pattern: request.form
      - pattern: request.values
      - pattern: request.json
      - pattern: request.data
      - pattern: request.cookies
      - pattern: request.headers
      - pattern: request.get_json(...)
      - pattern: request.GET
      - pattern: request.POST
      - pattern: request.COOKIES
      - pattern: request.META
      - pattern: request.body
      - pattern: request.query_params
      - pattern: request.path_params
      - pattern: request.query
      - pattern: request.forms
      - pattern: await request.json()
      - pattern: await request.body()
      - pattern: await request.form()
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: bool(...)
      - pattern: uuid.UUID(...)
      - pattern: UUID(...)
      - pattern: Decimal(...)
      - pattern: len(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $CUR.executescript($Q)
              - pattern: $CUR.mogrify($Q, ...)
              - pattern: $MODEL.objects.raw($Q, ...)
              - pattern: $MODEL.objects.extra(..., where=[$Q], ...)
              - pattern: $SESSION.execute(sqlalchemy.text($Q), ...)
              - pattern: $SESSION.execute(text($Q), ...)
              - pattern: sqlalchemy.text($Q)
              - pattern: $CONN.exec_driver_sql($Q, ...)
          - focus-metavariable: $Q

  - id: bpm-inj-cmd-py
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Request data reaches a shell command. A `;`, `|` or `$(...)` in that
      value runs as a second command on the server. Pass the program and its
      arguments as a list without shell=True, and allowlist the values.
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      owasp: 'A03:2021 Injection'
      yields: ['rce']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - 'test_*.py'
        - '*_test.py'
        - 'conftest.py'
        - '**/tests/**'
        - '**/test/**'
    pattern-sources:
      # HTTP request data (flask, django, fastapi/starlette, bottle).
      - pattern: flask.request.args
      - pattern: flask.request.form
      - pattern: flask.request.values
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.cookies
      - pattern: flask.request.headers
      - pattern: flask.request.view_args
      - pattern: flask.request.get_json(...)
