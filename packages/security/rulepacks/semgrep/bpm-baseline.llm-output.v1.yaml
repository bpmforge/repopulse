        patterns:
          - pattern-either:
              - pattern: jsonschema.validate($X, ...)
              - pattern: jsonschema.validate(instance=$X, ...)
              - patterns:
                  - pattern: $VAL.validate($X)
                  - metavariable-regex:
                      metavariable: $VAL
                      regex: (?i).*validator
          - focus-metavariable: $X
      - pattern: int(...)
      - pattern: float(...)
      - pattern: bool(...)
      # Tool-call arguments: generated against a declared parameter schema and
      # handed to a dispatcher, as in the JavaScript rule; and the SDK's own
      # serialisation of a response object is not model text.
      - pattern: $X.function.arguments
      - pattern: $X.partial_json
      - pattern: $X.json()
      - pattern: $X.model_dump_json(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: json.loads($X, ...)
              - pattern: orjson.loads($X)
              - pattern: ujson.loads($X, ...)
              - pattern: json5.loads($X, ...)
              - pattern: ast.literal_eval($X)
              - pattern: yaml.safe_load($X)
              - pattern: yaml.load($X, ...)
              - pattern: json_repair.loads($X, ...)
              - pattern: json_repair.repair_json($X, ..., return_objects=True, ...)
          - focus-metavariable: $X
          # Validated where it is parsed.
          - pattern-not-inside: $M.model_validate(...)
          - pattern-not-inside: $M.parse_obj(...)
          - pattern-not-inside: $M.validate_python(...)
          - pattern-not-inside: jsonschema.validate(...)
          - pattern-not-inside: $S.load(...)
          - pattern-not-inside: $M(**$J.$L(...))
          # Structured output requested in the same function: Gemini's
          # response_schema constrains decoding, so `response.text` is the
          # schema's JSON (the SDK's `.parsed` is the same object, typed).
          - pattern-not-inside: |
              def $F(...):
                  ...
                  <... "response_schema" ...>
                  ...
          - pattern-not-inside: |
              def $F(...):
                  ...
                  <... $C(..., response_schema=$RS, ...) ...>
                  ...
          - pattern-not-inside: |
              def $F(...):
                  ...
                  <... $C(..., response_json_schema=$RS, ...) ...>
                  ...
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  <... "response_schema" ...>
                  ...
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  <... $C(..., response_schema=$RS, ...) ...>
                  ...
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  <... $C(..., response_json_schema=$RS, ...) ...>
                  ...
          # Validated later in the same function. Written at function level
          # so the engine's deep statement matching finds the parse and the
          # check at any nesting — inside a try with a fallback, under an
          # `if isinstance(raw, str)`, or a key at a time.
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.model_validate($V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.parse_obj($V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.validate_python($V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M(**$V) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... jsonschema.validate($V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... jsonschema.validate(instance=$V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $VAL.validate($V) ...>
          # A hand-written check on a key's type is a schema check, written out.
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... isinstance($V.get(...), $T) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V[$K] = $J.$L(...)
                  ...
                  <... $M.model_validate($V, ...) ...>
          - pattern-not-inside: |
              def $F(...):
                  ...
                  $V[$K] = $J.$L(...)
                  ...
                  <... $M(**$V) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.model_validate($V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.parse_obj($V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M.validate_python($V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $M(**$V) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... jsonschema.validate($V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... jsonschema.validate(instance=$V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... $VAL.validate($V) ...>
          # A hand-written check on a key's type is a schema check, written out.
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V = $J.$L(...)
                  ...
                  <... isinstance($V.get(...), $T) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V[$K] = $J.$L(...)
                  ...
                  <... $M.model_validate($V, ...) ...>
          - pattern-not-inside: |
              async def $F(...):
                  ...
                  $V[$K] = $J.$L(...)
                  ...
                  <... $M(**$V) ...>

  # ===========================================================================
  # Jinja templates
  # ===========================================================================
  - id: bpm-llm-output-jinja-safe
    languages: [generic]
    severity: WARNING
    message: >-
      A template marks a model-output value `|safe`, switching Jinja's
      autoescaping off for text a model wrote. Prompt injection makes that
      text attacker text, and `|safe` renders any <script> in it. Render it
      escaped, or run it through an HTML sanitizer (bleach, nh3) in Python and
      mark only the sanitized result safe.
    metadata:
      source: R-28
      category: security
      cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
      yields: ['xss']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      include:
        - '*.html'
        - '*.htm'
        - '*.jinja'
        - '*.jinja2'
        - '*.j2'
    # A template cannot be followed back to an SDK call, so the variable has to
    # NAME itself as model output. Names that could be anything — `response`,
    # `content`, `answer` alone — are deliberately not on the list.
    pattern-regex: >-
      \{\{-?\s*(?i:[\w.\[\]'"]*(?:llm|gpt|completion|ai_(?:response|answer|reply|message|output)|assistant_(?:message|reply|response)|model_(?:output|response|answer)|chatbot|bot_(?:reply|response|message)|generated_(?:html|text|answer|content))[\w.\[\]'"]*)\s*(?:\|\s*\w+(?:\([^)]*\))?\s*)*\|\s*safe\b
