          - pattern-not-inside: $S.parse(..., $P.parse(...), ...)
          - pattern-not-inside: $S.safeParse(..., $P.parse(...), ...)
          - pattern-not-inside: $S.parseAsync(..., $P.parse(...), ...)
          - pattern-not-inside: $S.safeParseAsync(..., $P.parse(...), ...)
          - pattern-not-inside: $S.validate(..., $P.parse(...), ...)
          - pattern-not-inside: $S.validateSync(..., $P.parse(...), ...)
          - pattern-not-inside: $S.decode(..., $P.parse(...), ...)
          - pattern-not-inside: $S.is(..., $P.parse(...), ...)
          # Validated after it is parsed: `const raw = JSON.parse(text);
          # const data = Schema.parse(raw)`, also when the parse sits in a
          # try block with a fallback.
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.parse(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.safeParse(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.parseAsync(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.safeParseAsync(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.validate(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.validateSync(..., $V, ...) ...>
          - pattern-not-inside: |
              $V = $P.parse(...);
              ...
              <... $S.decode(..., $V, ...) ...>
          # An ajv validator compiled earlier, applied to the parsed value.
          - pattern-not-inside: |
              $VALIDATE = $AJV.compile(...);
              ...
              $V = $P.parse(...);
              ...
              <... $VALIDATE($V) ...>
          - pattern-not-inside: |
              try { ... $V = $P.parse(...); ... } catch ($E) { ... }
              ...
              <... $S.parse(..., $V, ...) ...>
          - pattern-not-inside: |
              try { ... $V = $P.parse(...); ... } catch ($E) { ... }
              ...
              <... $S.safeParse(..., $V, ...) ...>
          - pattern-not-inside: |
              try { ... $V = $P.parse(...); ... } catch { ... }
              ...
              <... $S.parse(..., $V, ...) ...>
          - pattern-not-inside: |
              try { ... $V = $P.parse(...); ... } catch { ... }
              ...
              <... $S.safeParse(..., $V, ...) ...>
          # Strict structured output requested in the same function: the API
          # enforced the schema, and JSON.parse is how the SDK hands it back.
          - pattern-not-inside: |
              $R = await $C.create({..., response_format: zodResponseFormat(...), ...});
              ...
          - pattern-not-inside: |
              $R = await $C.create({..., response_format: {..., type: "json_schema", ...}, ...});
              ...

