                  - pattern: $CHECK($X)
                  - metavariable-regex:
                      metavariable: $CHECK
                      regex: ^(validate\w*|is[A-Z]\w*|assert[A-Z]\w*)$
              - patterns:
                  - pattern: $VALIDATE($X)
