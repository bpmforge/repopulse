  - id: bpm-llm-output-exec-py
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      Model output reaches code execution (eval, exec, compile, a shell or a
      subprocess). Whatever the model was shown — a retrieved document, a web
      page, a user's message — can steer what it writes, so this runs text an
      attacker can influence. Map a schema-validated field onto an allowlisted
      action instead, or run generated code in a sandbox with nothing worth
      taking.
    metadata:
      source: R-28
      category: security
      cwe: 'CWE-94: Improper Control of Generation of Code'
      yields: ['rce']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - 'test_*.py'
        - '*_test.py'
        - 'conftest.py'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # OpenAI-shaped responses, attribute and dict style (LiteLLM, the legacy
      # openai<1 SDK and raw HTTP clients return dicts).
      - pattern: $R.choices[$I].message
      - pattern: $R.choices[$I].text
      - pattern: $R.choices[$I].delta
      - pattern: $R["choices"][$I]["message"]
      - pattern: $R["choices"][$I]["text"]
      - pattern: $R["choices"][$I]["delta"]
      - pattern: $R.output_text
      # Anthropic — only in a file that imports the SDK. `.content[0].text` is
      # also the shape of an MCP tool result and many other APIs, and
      # `messages.create` is Twilio's SMS call; the import is what says which,
      # and it also lets the engine skip every file that has none (these two
      # patterns alone were most of the pack's run time before the gate).
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import anthropic
                  ...
              - pattern-inside: |
                  from anthropic import $SDK
                  ...
          - pattern-either:
              - pattern: $C.messages.create(...)
              - pattern: $C.messages.stream(...)
              - pattern: $C.beta.messages.create(...)
              - pattern: $R.content[$I].text
      # Google GenAI (google-genai and google-generativeai).
      - pattern: $M.generate_content(...)
      - pattern: $M.generate_content_async(...)
      # Ollama, module-level and through a client.
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
      - pattern: ollama.Client(...).chat(...)
      - pattern: ollama.Client(...).generate(...)
      - patterns:
          - pattern-either:
              - pattern: $O.chat(...)
              - pattern: $O.generate(...)
          - pattern-either:
              - pattern-inside: |
                  $O = ollama.Client(...)
                  ...
              - pattern-inside: |
                  $O = ollama.AsyncClient(...)
                  ...
      # LangChain chat models, in a file that imports one: `.invoke` alone is
      # every Runnable, Electron IPC and AWS Lambda.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  from langchain_openai import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_anthropic import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_google_genai import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_google_vertexai import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_ollama import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_aws import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_mistralai import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_groq import $CHAT
                  ...
              - pattern-inside: |
                  from langchain_community.chat_models import $CHAT
                  ...
              - pattern-inside: |
                  from langchain.chat_models import $CHAT
                  ...
          - pattern-either:
              - pattern: $LLM.invoke(...).content
              - pattern: (await $LLM.ainvoke(...)).content
              - patterns:
                  - pattern: $MSG.content
                  - pattern-either:
                      - pattern-inside: |
                          $MSG = $LLM.invoke(...)
                          ...
                      - pattern-inside: |
                          $MSG = await $LLM.ainvoke(...)
                          ...
      # LiteLLM.
      - pattern: litellm.completion(...)
      - pattern: litellm.acompletion(...)
      - pattern: litellm.text_completion(...)
    pattern-sanitizers:
      # Structured output.
      - pattern: $R.choices[$I].message.parsed
      - pattern: $R.output_parsed
      - pattern: $R.parsed
      # pydantic. Spelled out rather than `$M.$P(...)` plus a regex: a pattern
      # that matches every method call costs on every file.
      - pattern: $M.model_validate(...)
      - pattern: $M.model_validate_json(...)
      - pattern: $M.model_validate_strings(...)
      - pattern: $M.parse_obj(...)
      - pattern: $M.parse_raw(...)
      - pattern: $M.validate_python(...)
      - pattern: $M.validate_json(...)
      - pattern: pydantic.parse_obj_as(...)
      - pattern: pydantic.TypeAdapter(...).validate_python(...)
      - pattern: pydantic.TypeAdapter(...).validate_json(...)
      # marshmallow: a `*schema` object's load.
      - patterns:
          - pattern: $S.load(...)
          - metavariable-regex:
              metavariable: $S
              regex: (?i).*schema
      # jsonschema checks the value in place.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: jsonschema.validate($X, ...)
              - pattern: jsonschema.validate(instance=$X, ...)
              - patterns:
                  - pattern: $VAL.validate($X)
                  - metavariable-regex:
                      metavariable: $VAL
                      regex: (?i).*validator
          - focus-metavariable: $X
      - pattern: int(...)
      - pattern: float(...)
      - pattern: bool(...)
      - pattern: shlex.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X, ...)
              - pattern: exec($X, ...)
              - pattern: compile($X, ...)
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
              - pattern: subprocess.run($X, ...)
              - pattern: subprocess.call($X, ...)
              - pattern: subprocess.check_call($X, ...)
              - pattern: subprocess.check_output($X, ...)
              - pattern: subprocess.Popen($X, ...)
              - pattern: subprocess.getoutput($X)
              - pattern: subprocess.getstatusoutput($X)
              - pattern: asyncio.create_subprocess_shell($X, ...)
              - pattern: asyncio.create_subprocess_exec($X, ...)
              - pattern: pexpect.spawn($X, ...)
              - pattern: pexpect.run($X, ...)
          - focus-metavariable: $X

  - id: bpm-llm-output-injection-py
