          - pattern-either:
              - pattern-inside: |
                  import $SDK from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  import { $SDK } from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  import * as $SDK from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  $SDK = require('@anthropic-ai/sdk');
                  ...
          - pattern-either:
              - pattern: $C.messages.create(...)
              - pattern: $C.messages.stream(...)
              - pattern: $C.beta.messages.create(...)
              - pattern: $R.content[$I].text
              - pattern: $R.content[$I]?.text
      # Google GenAI (both the old and the new SDK name the call this way).
      - pattern: $M.generateContent(...)
      - pattern: $M.generateContentStream(...)
      # Ollama.
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
      - patterns:
          - pattern-either:
              - pattern: $O.chat(...)
              - pattern: $O.generate(...)
          - pattern-inside: |
              $O = new Ollama(...);
              ...
      # LangChain chat models, in a file that imports one: `.invoke` alone is
      # every Runnable, Electron IPC and AWS Lambda.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/openai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/anthropic';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/google-genai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/ollama';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/aws';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/mistralai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/groq';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/community/chat_models';
                  ...
          - pattern-either:
              - pattern: (await $LLM.invoke(...)).content
              - patterns:
                  - pattern: $MSG.content
                  - pattern-inside: |
                      $MSG = await $LLM.invoke(...);
                      ...
      # Vercel AI SDK.
      - pattern: generateText(...)
      - pattern: streamText(...)
    pattern-sanitizers:
      # Structured output: the SDK already parsed against a schema.
      - pattern: $R.choices[$I].message.parsed
      - pattern: $R.choices[$I]?.message?.parsed
      - pattern: $R.output_parsed
      - pattern: $R.experimental_output
      # zod / yup / superstruct-style objects named for what they are, and an
      # inline `z.object({...}).parse(...)`.
      - patterns:
          - pattern-either:
              - pattern: $S.parse(...)
              - pattern: $S.safeParse(...)
              - pattern: $S.parseAsync(...)
              - pattern: $S.safeParseAsync(...)
              - pattern: $S.validate(...)
              - pattern: $S.validateSync(...)
              - pattern: $S.cast(...)
              - pattern: $S.decode(...)
          - metavariable-regex:
              metavariable: $S
              regex: (?is)(.*(schema|validator|parser)\s*$|z\s*\.)
      # valibot: v.parse(Schema, data)
      - patterns:
          - pattern-either:
              - pattern: $V.parse($SCH, $X)
              - pattern: $V.safeParse($SCH, $X)
          - metavariable-regex:
              metavariable: $V
              regex: ^(v|valibot)$
      # ajv, compiled validators and type guards check the value in place.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $AJV.validate($SCH, $X)
              - patterns:
                  - pattern: $CHECK($X)
                  - metavariable-regex:
                      metavariable: $CHECK
                      regex: ^(validate\w*|is[A-Z]\w*|assert[A-Z]\w*)$
              - patterns:
                  - pattern: $VALIDATE($X)
                  - pattern-inside: |
                      $VALIDATE = $AJV.compile(...);
                      ...
          - focus-metavariable: $X
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      # Markup and path escapes — only this rule's sinks are cleaned by them.
      - pattern: DOMPurify.sanitize(...)
      - pattern: $PURIFY.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: sanitize(...)
      - pattern: xss(...)
      - pattern: filterXSS(...)
      - pattern: escapeHtml(...)
      - pattern: escape(...)
      - pattern: he.encode(...)
      - pattern: he.escape(...)
      - pattern: path.basename(...)
      - pattern: basename(...)
    pattern-sinks:
      # SQL: the query text. A bound parameter is not a sink — it is the fix.
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.exec($SQL, ...)
              - pattern: $DB.prepare($SQL, ...)
              - pattern: $DB.unsafe($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
          - metavariable-regex:
              metavariable: $DB
              regex: (?i)^(\w+\.)*(db|database|conn|connection|pool|knex|sequelize|sql|pg|mysql|sqlite|tx|trx|prisma|\w*(db|database|conn|connection|pool|sql))$
          - focus-metavariable: $SQL
      # Markup.
      - patterns:
          - pattern-either:
              - pattern: $E.innerHTML = $X
              - pattern: $E.innerHTML += $X
              - pattern: $E.outerHTML = $X
              - pattern: $E.insertAdjacentHTML($POS, $X)
              - pattern: document.write($X)
              - pattern: document.writeln($X)
              - pattern: |
                  <$T dangerouslySetInnerHTML={{__html: $X}} />
              - pattern: |
                  <$T dangerouslySetInnerHTML={{__html: $X}}>...</$T>
          - focus-metavariable: $X
      # Filesystem paths — the first argument only. Writing model text INTO a
      # file is fine; letting it choose WHICH file is the problem.
      - patterns:
          - pattern-either:
              - pattern: fs.$FSF($P, ...)
              - pattern: fs.promises.$FSF($P, ...)
              - patterns:
                  - pattern: $FS.$FSF($P, ...)
                  - metavariable-regex:
                      metavariable: $FS
                      regex: ^(fsp|fsPromises|fse|fsExtra|promises)$
              - pattern: $FSF($P, ...)
          - metavariable-regex:
              metavariable: $FSF
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|unlink|unlinkSync|rm|rmSync|rmdir|rmdirSync|mkdir|mkdirSync|createReadStream|createWriteStream|rename|renameSync|copyFile|copyFileSync|outputFile|outputFileSync|remove|removeSync)$
          - focus-metavariable: $P

  - id: bpm-llm-output-json-unvalidated
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Model output is parsed as JSON and used with no schema check. A model
      returns the shape it was asked for most of the time; the rest of the time
      it returns a different shape, a truncated object or prose around the
      JSON, and every field read after this line is a guess. Validate with a
      schema (zod, valibot, ajv) or request structured output and read the
      parsed result.
