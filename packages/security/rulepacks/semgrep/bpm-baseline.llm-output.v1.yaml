# bpm-rulepacks — model output used without validation (W18-09, R-28,
# mechanical-checks plan §E, CODE_HEALTH_SUITE.md §1).
#
# PROVENANCE: written for RepoPulse. Nothing here is copied, adapted or derived
# from the Semgrep registry (DESIGN_REVIEW.md G-18); every rule says so in its
# metadata.
#
# WHAT IS BEING CAUGHT. Text a model wrote is input from whoever wrote the
# prompt, the documents it retrieved and the pages it read — prompt injection
# makes any of them the author. The shape AI-written code produces most often is
# `JSON.parse(completion.choices[0].message.content)` followed by `data.command`,
# `data.sql` or `data.path`, as if the model were a typed API. These are TAINT
# rules because the question is a flow, not a call: the model response is the
# source, a schema check is what cleans it, and the sink is wherever its text
# becomes code, a query, markup, a path — or a parsed object nobody checked.
#
# SOURCES are SDK response fields, not every variable called `response`:
#   - OpenAI-shaped `.choices[i].message|text|delta` — also LiteLLM, Groq,
#     Together, OpenRouter, DeepSeek and Ollama's OpenAI-compatible endpoint,
#     which all return that shape — and Responses-API `output_text`;
#   - Anthropic `messages.create` / `messages.stream` results and
#     `.content[i].text`, in files that import the Anthropic SDK;
#   - Google GenAI `generateContent` / `generate_content` results;
#   - Ollama `chat` / `generate`, module-level or through its client;
#   - LangChain chat models' `.invoke(...).content`, in files importing one;
#   - the Vercel AI SDK's `generateText` / `streamText` results;
#   - LiteLLM `completion` / `acompletion`, dict subscripts included.
# Structured output is NOT a source: `.parsed`, `output_parsed`,
# `generateObject().object` and `experimental_output` came through a schema.
#
# SANITIZERS are schema validation (zod, valibot, ajv, yup, pydantic,
# jsonschema, marshmallow), structured-output fields, and conversions that leave
# no text behind. Each rule adds only the escapes that clean ITS sink —
# DOMPurify for markup, a quoting helper for a shell, basename for a path. An
# escape for a different sink is not a sanitizer: html.escape does nothing for
# SQL.
#
# THE ENGINE IS OPENGREP in production (semgrep-compatible format). Validated at
# authoring time with semgrep 1.181.0 against fixtures/llm-output/ and a corpus
# of open-source LLM apps and agents (W18-09 ticket note). Engine behaviour that
# shaped the patterns:
#   - `metavariable-regex` is anchored at the start of the bound text, so the
#     regexes below begin with `.*` wherever a suffix is what matters;
#   - `a?.b` does not match a pattern written `a.b`, so optional-chaining forms
#     are spelled out;
#   - no YAML anchors: shared source and sanitizer lists are written out per
#     rule, so nothing depends on how a given engine build resolves aliases;
#   - `$X.exec(...)` is never a JS sink unless the receiver is named for
#     child_process: `RegExp.prototype.exec` is the most common call by that
#     name in code that post-processes model output (fences, JSON blocks);
#   - a pattern-not-inside line written `<... e ...>;` matches expression
#     statements only, so the validation forms below carry no semicolon and
#     also match `return Schema.parse(raw)` and `if (!Schema.safeParse(raw)…)`.
#
# EVERY RULE IS A CANDIDATE (`metadata.lifecycle: candidate`, §8.2): it runs in
# shadow and its findings stay out of scores until an admin promotes it on
# evidence. Test files are excluded — a mocked completion fed to JSON.parse in a
# test is the test working.
rules:
  # ===========================================================================
  # JavaScript / TypeScript
  # ===========================================================================
  - id: bpm-llm-output-exec
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Model output reaches code execution (eval, Function, vm or a child
      process). Whatever the model was shown — a retrieved document, a web
      page, a user's message — can steer what it writes, so this runs text an
      attacker can influence. Map a schema-validated field onto an allowlisted
      action instead, or run generated code in a sandbox with nothing worth
      taking.
    metadata:
      source: R-28
      category: security
      cwe: 'CWE-94: Improper Control of Generation of Code'
      yields: ['rce']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # OpenAI-shaped chat/completions responses (also LiteLLM proxy, Groq,
      # Together, OpenRouter, DeepSeek, Ollama's /v1 endpoint).
      - pattern: $R.choices[$I].message
      - pattern: $R.choices[$I]?.message
      - pattern: $R?.choices[$I]?.message
      - pattern: $R.choices[$I].text
      - pattern: $R.choices[$I]?.text
      - pattern: $R.choices[$I].delta
      - pattern: $R.choices[$I]?.delta
      - pattern: $R?.choices[$I]?.delta
      # OpenAI Responses API.
      - pattern: $R.output_text
      # Anthropic: the whole response (tool_use blocks carry model-written input
      # too) — only in a file that imports the SDK. `.content[0].text` is also the
      # shape of an MCP tool result, and `messages.create` is Twilio's SMS call.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import $SDK from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  import { $SDK } from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  import * as $SDK from '@anthropic-ai/sdk';
                  ...
              - pattern-inside: |
                  $SDK = require('@anthropic-ai/sdk');
                  ...
          - pattern-either:
              - pattern: $C.messages.create(...)
              - pattern: $C.messages.stream(...)
              - pattern: $C.beta.messages.create(...)
              - pattern: $R.content[$I].text
              - pattern: $R.content[$I]?.text
      # Google GenAI (both the old and the new SDK name the call this way).
      - pattern: $M.generateContent(...)
      - pattern: $M.generateContentStream(...)
      # Ollama.
      - pattern: ollama.chat(...)
      - pattern: ollama.generate(...)
      - patterns:
          - pattern-either:
              - pattern: $O.chat(...)
              - pattern: $O.generate(...)
          - pattern-inside: |
              $O = new Ollama(...);
              ...
      # LangChain chat models, in a file that imports one: `.invoke` alone is
      # every Runnable, Electron IPC and AWS Lambda.
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/openai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/anthropic';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/google-genai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/ollama';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/aws';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/mistralai';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/groq';
                  ...
              - pattern-inside: |
                  import { ..., $CHAT, ... } from '@langchain/community/chat_models';
                  ...
          - pattern-either:
              - pattern: (await $LLM.invoke(...)).content
              - patterns:
                  - pattern: $MSG.content
                  - pattern-inside: |
                      $MSG = await $LLM.invoke(...);
                      ...
      # Vercel AI SDK.
      - pattern: generateText(...)
      - pattern: streamText(...)
    pattern-sanitizers:
      # Structured output: the SDK already parsed against a schema.
      - pattern: $R.choices[$I].message.parsed
      - pattern: $R.choices[$I]?.message?.parsed
      - pattern: $R.output_parsed
      - pattern: $R.experimental_output
      # zod / yup / superstruct-style objects named for what they are, and an
      # inline `z.object({...}).parse(...)`.
      - patterns:
          - pattern-either:
              - pattern: $S.parse(...)
              - pattern: $S.safeParse(...)
              - pattern: $S.parseAsync(...)
              - pattern: $S.safeParseAsync(...)
              - pattern: $S.validate(...)
              - pattern: $S.validateSync(...)
              - pattern: $S.cast(...)
              - pattern: $S.decode(...)
          - metavariable-regex:
              metavariable: $S
              regex: (?is)(.*(schema|validator|parser)\s*$|z\s*\.)
      # valibot: v.parse(Schema, data)
      - patterns:
          - pattern-either:
              - pattern: $V.parse($SCH, $X)
              - pattern: $V.safeParse($SCH, $X)
          - metavariable-regex:
              metavariable: $V
              regex: ^(v|valibot)$
      # ajv, compiled validators and type guards check the value in place.
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: $AJV.validate($SCH, $X)
              - patterns:
                  - pattern: $CHECK($X)
                  - metavariable-regex:
                      metavariable: $CHECK
                      regex: ^(validate\w*|is[A-Z]\w*|assert[A-Z]\w*)$
              - patterns:
                  - pattern: $VALIDATE($X)
                  - pattern-inside: |
                      $VALIDATE = $AJV.compile(...);
                      ...
          - focus-metavariable: $X
      # Conversions that leave no text behind.
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: shellescape(...)
      - pattern: shellQuote.quote(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($X)
              - pattern: new Function(..., $X)
              - pattern: Function(..., $X)
              - pattern: $VM.runInNewContext($X, ...)
              - pattern: $VM.runInThisContext($X, ...)
              - pattern: $VM.runInContext($X, ...)
              - pattern: new $VM.Script($X, ...)
              - pattern: execaCommand($X, ...)
              - pattern: execaCommandSync($X, ...)
              - pattern: $EXECA.execaCommand($X, ...)
              - pattern: $EXECA.execaCommandSync($X, ...)
              # Bare calls: what `import { exec } from 'node:child_process'`
              # and its promisified forms look like at the call site. A bare
              # `exec(…)` in JS is a shell; `RegExp#exec` always has a receiver.
              - pattern: exec($X, ...)
              - pattern: execSync($X, ...)
              - pattern: execAsync($X, ...)
              - pattern: execPromise($X, ...)
              - pattern: spawn($X, ...)
              - pattern: spawnSync($X, ...)
              - pattern: execFile($X, ...)
              - pattern: execFileSync($X, ...)
              - pattern: require('child_process').$CPF($X, ...)
          - focus-metavariable: $X
      - patterns:
          - pattern: $CP.$CPF($X, ...)
          - metavariable-regex:
              metavariable: $CP
              regex: (?i)^(child_?process|cp)$
          - metavariable-regex:
              metavariable: $CPF
              regex: ^(exec|execSync|spawn|spawnSync|execFile|execFileSync)$
          - focus-metavariable: $X

  - id: bpm-llm-output-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Model output reaches a SQL string, an HTML sink or a filesystem path
      without validation. Prompt injection makes the model's text attacker
      text: generated SQL can read any table, generated markup runs script in
      the user's session, and a generated path can climb out of its directory.
      Validate the response against a schema and allowlist what it may name;
      parameterise the query, sanitize the markup, resolve the path under a
      fixed root.
    metadata:
      source: R-28
      category: security
      cwe: 'CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component'
      yields: ['sql-injection', 'xss']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
    paths:
      exclude:
        - '*.test.*'
        - '*.spec.*'
        - '**/__tests__/**'
        - '**/__mocks__/**'
        - '**/test/**'
        - '**/tests/**'
    pattern-sources:
      # OpenAI-shaped chat/completions responses (also LiteLLM proxy, Groq,
      # Together, OpenRouter, DeepSeek, Ollama's /v1 endpoint).
      - pattern: $R.choices[$I].message
      - pattern: $R.choices[$I]?.message
      - pattern: $R?.choices[$I]?.message
      - pattern: $R.choices[$I].text
      - pattern: $R.choices[$I]?.text
      - pattern: $R.choices[$I].delta
      - pattern: $R.choices[$I]?.delta
      - pattern: $R?.choices[$I]?.delta
      # OpenAI Responses API.
      - pattern: $R.output_text
      # Anthropic: the whole response (tool_use blocks carry model-written input
      # too) — only in a file that imports the SDK. `.content[0].text` is also the
      # shape of an MCP tool result, and `messages.create` is Twilio's SMS call.
