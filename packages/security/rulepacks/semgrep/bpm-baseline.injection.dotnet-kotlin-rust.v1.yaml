          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromForm] string $X, ...) { ... }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'Process.Start($C, ...)'
              - pattern: 'Process.Start(new ProcessStartInfo { FileName = $C, ... })'
              - pattern: 'Process.Start(new ProcessStartInfo { Arguments = $C, ... })'
              - pattern: 'new ProcessStartInfo($C, ...)'
          - focus-metavariable: $C
      - patterns:
          - pattern-either:
              - pattern: 'Process.Start($P, $C)'
              - pattern: 'Process.Start($P, $C, ...)'
              - pattern: 'new ProcessStartInfo($P, $C)'
          - focus-metavariable: $C

