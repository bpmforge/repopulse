          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromForm] string $X, ...) { ... }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
      - pattern: 'HtmlEncoder.Default.Encode(...)'
      - pattern: 'WebUtility.HtmlEncode(...)'
      - pattern: 'HttpUtility.HtmlEncode(...)'
      - pattern: 'Html.Encode(...)'
