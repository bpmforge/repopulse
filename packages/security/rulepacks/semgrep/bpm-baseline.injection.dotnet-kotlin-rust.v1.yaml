# bpm-rulepacks — injection dataflow for C#, Kotlin and Rust (W18-43), extending
# bpm-baseline.injection.v1.yaml (W18-33). Same method, same limits: TAINT mode,
# a SOURCE (request data), per-sink SANITIZERS and a SINK, one function deep.
#
# PROVENANCE: written for RepoPulse; not derived from the Semgrep registry.
#
# COVERAGE (rule id -> weakness):   cs   kt   rs
#   sql           CWE-89            x    x    x
#   cmd           CWE-78            x    x    x
#   path          CWE-22            x    x    x
#   xss           CWE-79            x         x
#   ssrf          CWE-918           x    x    x
#   redirect      CWE-601           x    x    x
#   deserialize   CWE-502           x    x         (Rust has no common unsafe sink;
#                                                    serde is memory- and type-safe)
# Kotlin XSS is left out: Spring `@ResponseBody` strings and Ktor `respondText`
# are not distinguishable from a JSON body without the content type, which the
# single-function engine cannot see. Rust unsafe FFI is excluded by design.
#
# SOURCES. C#: `Request.Query/Form/Headers/Cookies[...]`, and `[FromQuery]`,
# `[FromRoute]`, `[FromBody]`, `[FromHeader]` string parameters. Kotlin: Spring
# `@RequestParam`/`@PathVariable`/`@RequestBody`/`@RequestHeader` parameters and
# Ktor `call.parameters[...]`/`call.request.queryParameters[...]`. Rust: actix
# `req.query_string()`/`req.match_info()`, and web::Query/web::Path/axum
# Query/Path/Form extractors destructured in the handler signature. Typed
# non-string parameters (int, Guid) are not sources: they cannot carry text.
#
# ENGINE LIMITS measured with semgrep 1.181 (the scan image's Opengrep is not
# measurable from the build host): the C# and Kotlin parsers match annotated
# parameters; the Rust parser matches `fn` patterns with typed parameters and
# `format!` macros. A value passed to another function, stored in a field or
# built by a helper is not followed; that is why every rule is a candidate.
rules:
  # ===== C# (ASP.NET) =====================================================
  - id: bpm-inj-sql-cs
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      Request data reaches a SQL query as text. A value concatenated or
      interpolated into the query is an injection the day it holds a quote. Use
      SqlParameter placeholders, or FromSqlInterpolated/ExecuteSqlInterpolated,
      which parameterise for you.
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      owasp: 'A03:2021 Injection'
      yields: ['sql-injection', 'data-read']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
        Follows the value inside one method and through string interpolation and
        concatenation. A value passed to another method, field or stored
        procedure parameter is not followed.
    paths:
      exclude:
        - '**/*Tests.cs'
        - '**/*Test.cs'
        - '**/Tests/**'
        - '**/*.Tests/**'
    pattern-sources:
      - pattern: 'Request.Query[...]'
      - pattern: 'Request.Form[...]'
      - pattern: 'Request.Headers[...]'
      - pattern: 'Request.Cookies[...]'
      - pattern: 'Request.QueryString[...]'
      - pattern: 'Request.Params[...]'
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromQuery] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromRoute] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromBody] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromHeader] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromForm] string $X, ...) { ... }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'new SqlCommand($Q, ...)'
              - pattern: 'new SqlDataAdapter($Q, ...)'
              - pattern: 'new MySqlCommand($Q, ...)'
              - pattern: 'new NpgsqlCommand($Q, ...)'
              - pattern: 'new OracleCommand($Q, ...)'
              - pattern: 'new SQLiteCommand($Q, ...)'
              - pattern: '$DB.Database.ExecuteSqlRaw($Q, ...)'
              - pattern: '$DB.Database.ExecuteSqlRawAsync($Q, ...)'
              - pattern: '$SET.FromSqlRaw($Q, ...)'
              - pattern: '$CONN.Query($Q, ...)'
              - pattern: '$CONN.QueryAsync($Q, ...)'
              - pattern: '$CONN.Execute($Q, ...)'
              - pattern: '$CONN.ExecuteAsync($Q, ...)'
          - focus-metavariable: $Q

