          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
      - pattern: 'Url.IsLocalUrl(...)'
