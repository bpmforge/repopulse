          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
      - pattern: 'Path.GetFileName(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'File.ReadAllText($P, ...)'
              - pattern: 'File.ReadAllBytes($P)'
              - pattern: 'File.ReadAllLines($P, ...)'
              - pattern: 'File.OpenRead($P)'
              - pattern: 'File.WriteAllText($P, ...)'
              - pattern: 'File.WriteAllBytes($P, ...)'
              - pattern: 'File.Delete($P)'
              - pattern: 'File.Open($P, ...)'
              - pattern: 'System.IO.File.ReadAllText($P, ...)'
              - pattern: 'System.IO.File.ReadAllBytes($P)'
              - pattern: 'System.IO.File.OpenRead($P)'
              - pattern: 'System.IO.File.WriteAllText($P, ...)'
              - pattern: 'System.IO.File.Delete($P)'
              - pattern: 'new FileStream($P, ...)'
              - pattern: 'new StreamReader($P, ...)'
              - pattern: 'PhysicalFile($P, ...)'
              - pattern: 'Directory.Delete($P, ...)'
          - focus-metavariable: $P

  - id: bpm-inj-xss-cs
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      Request data is written into an HTML response unescaped. A value with
      markup runs as script in the visitor's browser. Encode it with
      HtmlEncoder.Default.Encode, or render through a Razor view, which encodes
      by default.
    metadata:
      category: security
      cwe: 'CWE-79: Cross-site Scripting'
      owasp: 'A03:2021 Injection'
      yields: ['xss', 'session-hijack']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
