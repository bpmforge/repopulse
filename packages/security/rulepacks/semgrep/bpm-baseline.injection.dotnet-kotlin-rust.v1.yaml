    severity: ERROR
    message: >-
      Request data reaches a process start. A value that becomes the program or
      its argument string lets a caller run what they choose, or append
      arguments the program interprets. Run a fixed program with an argument
      list, validate against an allowlist, and never go through a shell.
    metadata:
      category: security
      cwe: 'CWE-78: OS Command Injection'
      owasp: 'A03:2021 Injection'
      yields: ['command-injection', 'rce']
