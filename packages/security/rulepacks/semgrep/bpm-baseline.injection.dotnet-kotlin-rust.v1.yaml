          - focus-metavariable: $U

  - id: bpm-inj-deserialize-cs
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      A formatter that instantiates types named in the data deserializes request
      data. BinaryFormatter, NetDataContractSerializer, SoapFormatter,
      LosFormatter and ObjectStateFormatter can be driven to run code, and
      Microsoft has deprecated them for that reason. Use System.Text.Json or a
      contract-based serializer.
    metadata:
      category: security
      cwe: 'CWE-502: Deserialization of Untrusted Data'
      owasp: 'A08:2021 Software and Data Integrity Failures'
      yields: ['rce', 'deserialization']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
        Reports the unsafe formatter wherever it is fed request data, or a
        stream built from it. The formatters are dangerous on any untrusted
        input; a read from a trusted file is not reported.
    paths:
      exclude:
        - '**/*Tests.cs'
        - '**/*Test.cs'
        - '**/Tests/**'
        - '**/*.Tests/**'
    pattern-sources:
      - pattern: 'Request.Query[...]'
      - pattern: 'Request.Form[...]'
      - pattern: 'Request.Headers[...]'
      - pattern: 'Request.Cookies[...]'
      - pattern: 'Request.QueryString[...]'
      - pattern: 'Request.Params[...]'
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromQuery] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromRoute] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromBody] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromHeader] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromForm] string $X, ...) { ... }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: '$F.Deserialize($S, ...)'
          - metavariable-regex:
              metavariable: $F
              regex: (?i)^(formatter|binaryFormatter|bf|netDataContractSerializer|soapFormatter|losFormatter|objectStateFormatter)$
          - focus-metavariable: $S

  # ===== Kotlin (Spring, Ktor) =============================================
  - id: bpm-inj-sql-kt
    mode: taint
    languages: [kotlin]
    severity: ERROR
    message: >-
      Request data reaches a SQL query as text. A value built into the query
      string is an injection the day it holds a quote. Use bound parameters: `?`
      placeholders with JdbcTemplate, `:name` with NamedParameterJdbcTemplate,
      or a PreparedStatement.
    metadata:
      category: security
      cwe: 'CWE-89: SQL Injection'
      owasp: 'A03:2021 Injection'
      yields: ['sql-injection', 'data-read']
      lifecycle: candidate
      provenance: written for RepoPulse; not derived from any registry pack
      limitation: >-
        Follows the value inside one function and through string templates and
        concatenation. A value passed to another function, a field or a
        repository method is not followed.
    paths:
      exclude:
        - '**/test/**'
        - '**/androidTest/**'
        - '**/*Test.kt'
        - '**/*Tests.kt'
    pattern-sources:
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestParam $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestParam(...) $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @PathVariable $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @PathVariable(...) $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestBody $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestBody(...) $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestHeader $X: String, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              fun $M(..., @RequestHeader(...) $X: String, ...) { ... }
          - focus-metavariable: $X
      - pattern: 'call.parameters[...]'
      - pattern: 'call.request.queryParameters[...]'
      - pattern: 'call.request.headers[...]'
      - pattern: 'call.receiveText()'
      - pattern: 'call.receiveParameters()'
    pattern-sanitizers:
      - pattern: '$X.toInt()'
      - pattern: '$X.toLong()'
      - pattern: '$X.toIntOrNull()'
      - pattern: '$X.toLongOrNull()'
      - pattern: 'UUID.fromString(...)'
      - pattern: '$X.toBoolean()'
      - pattern: 'Integer.parseInt(...)'
