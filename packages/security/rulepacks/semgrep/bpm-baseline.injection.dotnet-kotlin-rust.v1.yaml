          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromBody] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromHeader] string $X, ...) { ... }
          - focus-metavariable: $X
      - patterns:
          - pattern-inside: |
              $RET $M(..., [FromForm] string $X, ...) { ... }
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: 'int.Parse(...)'
      - pattern: 'long.Parse(...)'
      - pattern: 'Guid.Parse(...)'
      - pattern: 'Convert.ToInt32(...)'
      - pattern: 'Convert.ToInt64(...)'
      - pattern: 'int.TryParse(...)'
      - pattern: 'bool.Parse(...)'
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: 'new HttpRequestMessage($M, $U)'
              - pattern: 'WebRequest.Create($U)'
              - pattern: 'new Uri($U)'
          - focus-metavariable: $U
      - patterns:
          - pattern-either:
              - pattern: '$C.GetAsync($U, ...)'
              - pattern: '$C.GetStringAsync($U, ...)'
              - pattern: '$C.GetByteArrayAsync($U)'
              - pattern: '$C.GetStreamAsync($U)'
              - pattern: '$C.PostAsync($U, ...)'
              - pattern: '$C.PutAsync($U, ...)'
              - pattern: '$C.DeleteAsync($U, ...)'
              - pattern: '$C.DownloadString($U)'
              - pattern: '$C.DownloadStringAsync($U)'
              - pattern: '$C.DownloadData($U)'
          - metavariable-regex:
              metavariable: $C
              regex: (?i)^(\w*client\w*|c|hc|wc|http|agent|session|rest_?template|webclient)$
          - focus-metavariable: $U

  - id: bpm-inj-redirect-cs
    mode: taint
    languages: [csharp]
    severity: WARNING
