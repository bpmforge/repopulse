              - pattern: 'Html.Raw($H)'
          - focus-metavariable: $H

  - id: bpm-inj-ssrf-cs
    mode: taint
    languages: [csharp]
    severity: ERROR
    message: >-
      Request data chooses the URL the server fetches. A caller can point it at
      internal services or the cloud metadata address. Resolve the host and
