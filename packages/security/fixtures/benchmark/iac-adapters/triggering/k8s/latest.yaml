apiVersion: apps/v1
# expect: tool.checkov.CKV_K8S_14
kind: Deployment
metadata:
  name: latest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: latest
  template:
    metadata:
      labels:
        app: latest
    spec:
      containers:
        - name: app
          image: registry.example.com/app:latest
          securityContext:
            allowPrivilegeEscalation: false
