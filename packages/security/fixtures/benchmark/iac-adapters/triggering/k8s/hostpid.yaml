apiVersion: apps/v1
# expect: tool.checkov.CKV_K8S_17
kind: Deployment
metadata:
  name: hostpid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostpid
  template:
    metadata:
      labels:
        app: hostpid
    spec:
      hostPID: true
      containers:
        - name: app
          image: registry.example.com/app:1.4.2
          securityContext:
            allowPrivilegeEscalation: false
