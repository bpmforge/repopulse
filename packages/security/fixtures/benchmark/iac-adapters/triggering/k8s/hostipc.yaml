apiVersion: apps/v1
# expect: tool.checkov.CKV_K8S_18
kind: Deployment
metadata:
  name: hostipc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostipc
  template:
    metadata:
      labels:
        app: hostipc
    spec:
      hostIPC: true
      containers:
        - name: app
          image: registry.example.com/app:1.4.2
          securityContext:
            allowPrivilegeEscalation: false
