AWSTemplateFormatVersion: "2010-09-09"
Resources:
  InternalSsh:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ssh from the internal network only
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 10.0.0.0/8
  PrivateDb:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: postgres
      AllocatedStorage: "20"
      PubliclyAccessible: false
      StorageEncrypted: true
  PrivateBucket:
    Type: AWS::S3::Bucket
    Properties:
      AccessControl: Private
  ScopedPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: scoped
      Roles: [ci]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: ["s3:GetObject"]
            Resource: "arn:aws:s3:::example/*"
  EncryptedVolume:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: us-east-1a
      Size: 8
      Encrypted: true
